name: Swing Bot (TQQQ/SOXL)

on:
  schedule:
    # 한국 23:00/03:00 (= UTC 14:00/18:00) — 미국 장중 실시간 신호 확인:
    # - 23:00 KST — 장 개시 전후 (여름 10:00 ET / 겨울 09:00 ET)
    # - 03:00 KST — 장중 (여름 14:00 ET / 겨울 13:00 ET)
    # 실시간 매매용: 사용자가 깨어 있는 시간대에 맞춤 — 봇의 부분-봉 방어가
    # 진행 중인 봉을 제외하고 직전 완성 봉 기준으로 판단한다.
    - cron: "0 14,18 * * 1-5"
  repository_dispatch:
    # cron-job.org가 한국 23:00/03:00(월~금) 발사 —
    # GitHub Actions 자체 스케줄 크론의 best-effort 지연/비활성화를 우회해
    # 장중 실시간 신호를 놓치지 않게 한다.
    # 설정: python3 setup_cronjob_org.py --swing
    types: [swing-bot]
  workflow_dispatch:           # 수동 실행 지원

concurrency:
  group: swing-bot             # 실행 직렬화 — 상태 파일 커밋 충돌 방지
  cancel-in-progress: false

jobs:
  run-swing:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync with latest remote (start from newest state)
        # 체크아웃 직후 최신 원격 상태로 rebase — 봇이 스테일 상태를 기준으로
        # 파일을 변경하지 않도록 충돌 윈도우를 최소화한다.
        run: git pull --rebase

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        # -q: pip 진행률 바(캐리지 리턴 \r)가 GitHub Actions 로그 뷰어를 깨뜨려
        #   "로그 표시 실패"/스텝 이름 오표시가 발생 — 조용히 설치해 방지
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt

      - name: Run Swing Bot
        # tee: Actions 로그에도 표시 + swing_log.txt 저장 (로그는 커밋하지 않음)
        run: |
          set -o pipefail
          python swing_bot.py 2>&1 | tee swing_log.txt

      - name: Show log on failure
        if: failure()
        run: cat swing_log.txt

      - name: Sync and Notify
        if: always()
        run: |
          git config --global user.name "Swing Bot"
          git config --global user.email "bot@example.com"

          # 상태/저널만 커밋 (로그/히스토리는 저장하지 않음 — 커밋 노이즈 방지)
          # swing_signals.jsonl: BUY/SELL 이벤트 누적 저널 — 성과 평가(swing_bot_eval.py)의 입력
          [ -f "swing_state.json" ] && git add swing_state.json
          [ -f "swing_signals.jsonl" ] && git add swing_signals.jsonl

          git commit -m "update: swing-state/signals $(date +'%Y-%m-%d')" || echo "No changes to commit"
          # -X theirs: 충돌 시 원격(사람) 버전을 유지 — 봇의 스테일 상태는 버리고 다음 실행에서 재생성.
          # || true: 일시적 실패(네트워크 등) 시에도 push는 계속 시도해 갱신 유실을 방지
          git pull --rebase -X theirs || true
          git push
