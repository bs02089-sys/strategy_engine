name: daily sigma alert

on:
  schedule:
    - cron: '0 10 * * 1-5'   # 평일 오전 10시 UTC (KST 오후 7시)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-sigma-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Sigma Report
        run: python SOXL_sigma_alert.py

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.vscode-push-token-2026 }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Push updated config.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.json
          git commit -m "Update config.json" || echo "No changes to commit"
          git push git@github.com:BS02089-SYS/strategy_engine.git HEAD:main
