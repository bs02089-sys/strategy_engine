name: fx_alert

on:
  push:
    branches:
      - main
    paths:
      - fx_alert.py
  schedule:
    # 💡 UTC 기준 (한국 시간 = UTC + 9시간)
    # 한국시간 12:00시 (UTC 03:00) 
    - cron: "0 3 * * 1-5"     
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8

jobs:
  fx_alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance beautifulsoup4

      - name: Run fx_alert
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.vscode_push_token_2026 }}
        run: python fx_alert.py

      - name: 실행 결과 및 로그 최종 커밋 & 푸시
        if: always()
        env:
          PUSH_TOKEN: ${{ secrets.vscode_push_token_2026 }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 💡 [인증 재생성] 푸시 직전 원격 주소를 명확히 바인딩합니다.
          CLEAN_TOKEN=$(echo "$PUSH_TOKEN" | tr -d '\r\n')
          git remote set-url origin "https://x-access-token:${CLEAN_TOKEN}@github.com/bs02089-sys/strategy_engine.git"
          
          # 💡 [정정 완결] 가상의 fx_config.json 대신, 실제 이미지의 'config.json'을 추적합니다.
          if [ -f config.json ]; then
            git add config.json
          fi
          
          # 💡 통계 데이터 캐시 파일도 변경점이 있으면 함께 저장소에 누적합니다.
          if [ -f historical_rates_cache.json ]; then
            git add historical_rates_cache.json
          fi
          
          if [ -f fx_alert.log ]; then
            git add -f fx_alert.log
          fi
          
          # 변동 내역이 있을 때만 최종 push 수행
          if ! git diff --cached --quiet; then
            git commit -m "chore: config.json 내 exchange_status 환율 동기화 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push --force-with-lease || git push
          else
            echo "✅ 새로 변경된 환율 정보(config.json)나 로그가 없어 동기화를 건너뜁니다."
          fi