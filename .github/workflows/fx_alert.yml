name: fx_alert

on:
  push:
    branches:
      - main
    paths:
      - "fx_alert.py"

  schedule:
    - cron: "0 0 * * 1-5"    # KST 09:00
    - cron: "0 4 * * 1-5"    # KST 13:00
    - cron: "0 6 * * 1-5"    # KST 15:00

  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8

jobs:
  fx_alert:
    runs-on: ubuntu-latest

    steps:
      - name: Repository Checkout (SSH)
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.vscode_push_token_2026 }}
          ssh-strict: false
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests

      - name: Run fx_alert
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
        run: python fx_alert.py

      - name: 실행 로그 커밋 & 푸시
        if: always()
        run: |
          if [ -f fx_alert.log ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            
            git add -f fx_alert.log
            
            git commit -m "chore: fx_alert 실행 로그 업데이트 ($(date -u +'%Y-%m-%d %H:%M UTC'))" || echo "No changes to commit"
            
            # SSH 키를 다시 명시적으로 사용
            GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=no" git push
          else
            echo "⚠️ fx_alert.log 파일이 없습니다."
          fi
