name: fx_alert

on:
  schedule:
    # 🎯 월요일부터 금요일까지 매일 UTC 03:00 (한국 시간 12:00)에 정식 자동 알림 딱 한 번만 발송!
    - cron: "0 3 * * 1-5"
  
  workflow_dispatch:
    # 🎯 원할 때 언제든 Actions 탭에서 버튼 눌러서 수동 실행 가능!

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8

jobs:
  fx_alert:
    runs-on: ubuntu-latest
    # 💡 [신규 최적화] 무한 모니터링 모드로 동작하므로, 깃허브 액션이 불필요하게 6시간 동안 
    # 서버를 붙잡고 있는 것을 방지하기 위해 최대 실행 시간을 360분(6시간)으로 타임아웃 제한을 걸어둡니다.
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance beautifulsoup4

      - name: Run fx_alert
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          # 💡 로컬/서버 하이브리드 판별 및 혹시 모를 내부 푸시 대응을 위해 여전히 주입해 둡니다.
          GITHUB_TOKEN: ${{ secrets.vscode_push_token_2026 }}
        run: python fx_alert.py

      - name: 실행 결과 및 로그 최종 커밋 & 푸시
        # 만약 타임아웃(6시간 경과)으로 취소되거나 수동으로 중단하더라도 무조건 실행
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 💡 외부 토큰 조합 대신 GitHub 기본 인증 헤더/오리진 구조를 그대로 활용합니다.
          # 특수문자가 섞인 비밀 토큰을 URL에 강제로 집어넣을 때 발생하는 파싱 에러를 완벽하게 차단합니다.
          git remote set-url origin "https://github.com/${{ github.repository }}.git"
          
          # 실시간 업데이트된 config.json 장바구니에 담기
          if [ -f config.json ]; then
            git add config.json
          fi
          
          # yfinance 통계 캐시 파일 담기
          if [ -f historical_rates_cache.json ]; then
            git add historical_rates_cache.json
          fi
          
          # 실시간 추적 로그 파일 강제 담기
          if [ -f fx_alert.log ]; then
            git add -f fx_alert.log
          fi
          
          # 변동 내역 최종 push 처리
          if ! git diff --cached --quiet; then
            git commit -m "chore: exchange_status 실시간 환율 및 런타임 로그 동기화 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push --force-with-lease || git push
          else
            echo "✅ 새로 변경된 데이터나 로그가 없어 동기화를 건너뜁니다."
          fi