name: fx_alert

on:
  push:
    branches:
      - main
    paths:
      - fx_alert.py
  schedule:
    # 💡 UTC 기준 (한국 시간 = UTC + 9시간)
    # 한국시간 12:00시 (UTC 03:00)에 가동 시작합니다.
    - cron: "0 3 * * 1-5"     
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8

jobs:
  fx_alert:
    runs-on: ubuntu-latest
    # fx_alert.py는 GitHub Actions에서 run_once() 단발 실행이므로 10분이면 충분합니다
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance beautifulsoup4

      - name: Run fx_alert
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          # 💡 로컬/서버 하이브리드 판별 및 혹시 모를 내부 푸시 대응을 위해 여전히 주입해 둡니다.
          GITHUB_TOKEN: ${{ secrets.vscode_push_token_2026 }}
        run: python fx_alert.py

      - name: Commit and push updated files
        # Safety net: even if the job times out or is cancelled,
        # any updated exchange logs and config are always committed.
        if: always()
        env:
          PUSH_TOKEN: ${{ secrets.vscode_push_token_2026 }}
          # [FIX] Force UTF-8 locale so bash handles multibyte chars safely.
          # Commits messages are now ASCII-only to prevent
          # "Malformed input to a URL function" from git push.
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          CLEAN_TOKEN=$(echo "$PUSH_TOKEN" | tr -d '\r\n')
          git remote set-url origin "https://x-access-token:${CLEAN_TOKEN}@github.com/bs02089-sys/strategy_engine.git"

          # Stage updated files
          [ -f config.json ]                  && git add config.json
          [ -f historical_rates_cache.json ]  && git add historical_rates_cache.json
          [ -f fx_alert.log ]                 && git add -f fx_alert.log

          # Commit and push only when there are staged changes
          if ! git diff --cached --quiet; then
            TIMESTAMP=$(date -u +'%Y-%m-%d %H:%M UTC')
            git commit -m "chore: sync exchange_status and runtime log (${TIMESTAMP})"
            git push --force-with-lease
          else
            echo "No changes to commit. Skipping push."
          fi