name: 나무증권 환율 적정성 알림

on:
  schedule:
    # 평일 오전 9시, 오후 1시, 오후 4시 (KST = UTC+9)
    # KST 09:00 = UTC 00:00 / KST 13:00 = UTC 04:00 / KST 16:00 = UTC 07:00
    - cron: "0 0 * * 1-5"
    - cron: "0 4 * * 1-5"
    - cron: "0 7 * * 1-5"

  # 수동 실행 (GitHub Actions 탭 → Run workflow)
  workflow_dispatch:

jobs:
  fx-alert:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install requests

      - name: 환율 적정성 분석 및 Discord 알림
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          NAMUH_SPREAD:    ${{ secrets.NAMUH_SPREAD }}
          PREFER_RATE:     ${{ secrets.PREFER_RATE }}
          PERCENTILE_THRESHOLD: ${{ secrets.PERCENTILE_THRESHOLD }}
        # fx_alert.py 위치에 맞게 경로 수정
        run: python strategy_engine/fx_alert.py
