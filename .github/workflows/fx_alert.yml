name: fx_alert

on:
  push:
    branches:
      - main
    paths:
      - "fx_alert.py"

  schedule:
    # 💡 UTC 기준 (한국 시간 = UTC + 9시간)
    # 💡 GitHub 서버 지연(약 30분~1시간 반)을 계산하여 시간을 대폭 당겼습니다.
    - cron: "0 23 * * 0-4"    # 1. 한국 시간 오전 08:00 지정을 통해 👉 실제 오전 9시~9시 반 개장 직후 실행 유도
    - cron: "0 3 * * 1-5"     # 2. 한국 시간 낮 12:00 지정을 통해 👉 실제 오후 1시~1시 반 점심 시장 실행 유도
    - cron: "0 5 * * 1-5"     # 3. ⭐️ 한국 시간 오후 02:00 지정을 통해 👉 실제 오후 3시~3시 반 주간 마감 직전 골든타임 실행 유도!

  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8

jobs:
  fx_alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git (토큰 기반 주소 설정)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.vscode_push_token_2026 }}@github.com/bs02089-sys/strategy_engine.git

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance

      - name: Run fx_alert
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
        run: python fx_alert.py

      - name: 실행 결과 및 로그 최종 커밋 & 푸시
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 💡 매니저 파일과 격리된 환율 전용 제이슨 파일(fx_config.json)을 장바구니에 담습니다.
          if [ -f fx_config.json ]; then
            git add fx_config.json
          fi
          
          if [ -f fx_alert.log ]; then
            git add -f fx_alert.log
          fi
          
          if ! git diff --cached --quiet; then
            git commit -m "chore: fx_alert 전용 데이터 및 로그 동기화 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push --force-with-lease || git push
          else
            echo "✅ 새로 변경된 환율 전용 데이터나 로그가 없어 동기화를 건너뜁니다."
          fi
