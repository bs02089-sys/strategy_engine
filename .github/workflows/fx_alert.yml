name: fx_alert

on:
  push:
    branches:
      - main
    paths:
      - "fx_alert.py"

  schedule:
    - cron: "0 0 * * 1-5"    # KST 09:00
    - cron: "0 4 * * 1-5"    # KST 13:00
    - cron: "0 6 * * 1-5"    # KST 15:00

  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8

jobs:
  fx_alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.vscode_push_token_2026 }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin git@github.com:bs02089-sys/strategy_engine.git

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests

      - name: Run fx_alert
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
        run: python fx_alert.py

      - name: 실행 로그 커밋 & 푸시
        if: always()
        run: |
          if [ -f fx_alert.log ]; then
            git add -f fx_alert.log
            git commit -m "chore: fx_alert 실행 로그 업데이트 ($(date -u +'%Y-%m-%d %H:%M UTC'))" || echo "No changes to commit"
            git push
          else
            echo "⚠️ fx_alert.log 파일이 없습니다."
          fi
