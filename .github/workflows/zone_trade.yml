name: Zone Trade Automation

on:
  schedule:
    # 한국 시간 평일 아침 7시 (UTC 기준 일~목 22시) 자동 실행
    - cron: '0 22 * * 0-4'
  workflow_dispatch: # 레포지토리에서 수동 실행 버튼 제공

jobs:
  run-trading-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Trading Script with Secrets
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ZONE_CONFIG_PATH: "zone_trade_config.json"
        run: |
          python zone_trade.py