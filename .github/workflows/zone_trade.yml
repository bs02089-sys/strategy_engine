name: Zone Trade Automation

on:
  schedule:
    # 매일 한국 시간 아침 7시 (UTC 기준 밤 10시) 자동 실행
    - cron: '0 22 * * *'
  workflow_dispatch: # 레포지토리에서 수동 실행 버튼 제공

jobs:
  run-trading-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14.6'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Trading Script with Secrets
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TRADING_TICKER: "PLTR"
          ZONE_WINDOW: "10"
        run: |
          python zone_trade.py