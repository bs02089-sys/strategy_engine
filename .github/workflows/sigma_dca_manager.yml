name: Sigma DCA Manager Engine

on:
  schedule:
    - cron: "24 23 * * 1-5"
  repository_dispatch:
    types: [ath-dca-monitor]
  workflow_dispatch:

concurrency:
  group: sigma-dca-manager
  cancel-in-progress: false

jobs:
  run-dca-manager:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Realtime ATH DCA Monitor (from cron-job.org dispatch)
        if: github.event_name == 'repository_dispatch'
        run: python sigma_DCA_manager.py --ath-monitor > sigma_log.txt 2>&1

      - name: Run DCA Manager (scheduled briefing)
        if: github.event_name != 'repository_dispatch'
        run: python sigma_DCA_manager.py > sigma_log.txt 2>&1

      - name: Show log on failure
        if: failure()
        run: cat sigma_log.txt

      - name: Sync and Notify
        if: always()
        run: |
          git config --global user.name "DCA Bot"
          git config --global user.email "bot@example.com"

          [ -f "sigma_log.txt" ] && git add sigma_log.txt
          [ -f "portfolio_config.json" ] && git add portfolio_config.json
          [ -f "sigma_history.csv" ] && git add sigma_history.csv

          git commit -m "update: dca-log $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git pull --rebase || true
          git push
