name: 매일 투자 엔진

on:
  schedule:
    - cron: "0 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write  # 깃허브에 파일을 저장(Push)하려면 이 권한이 필수입니다.

jobs:
  run-investment-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }} # 동기화를 위해 토큰 필요

      - name: Set up Python
        uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      
      - run: pip install yfinance pandas requests numpy pytz holidays
      
      # 1. 스크립트 실행 (파일이 생성됨)
      - name: Run scripts
        run: |
          python bear_market_signals.py
          python sigma_DCA_manager.py
      
      # 2. 결과 파일들을 깃허브로 동기화(Push)
      - name: Sync results to GitHub
        run: |
          git config --global user.name "Automated Bot"
          git config --global user.email "bot@example.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync investment data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
          
      # 3. Discord로 결과 알림 (파일 내용을 직접 읽어서 발송)
      - name: Send Discord notification
        if: always()
        run: |
          python - << 'EOF'
          import os, requests
          # 필요한 경우 여기서 result.txt나 json 파일을 읽어 메시지를 보낼 수 있습니다.
          payload = {"content": f"<@{os.environ['DISCORD_USER_ID']}> 🤖 투자 엔진 가동 및 데이터 동기화 완료."}
          requests.post(os.environ['DISCORD_WEBHOOK'], json=payload)
          EOF