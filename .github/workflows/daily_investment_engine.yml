name: Daily Investment Engine

on:
  schedule:
    - cron: "0 23 * * 1-5" # Runs daily at 23:00 UTC (Market Close)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-investment-engine:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: pip install yfinance pandas requests numpy pytz holidays
      
      # [CORE] Execute scripts and capture logs separately to avoid output corruption
      - name: Run logic and capture logs
        run: |
          python bear_market_signals.py > bear_log.txt 2>&1
          cat bear_log.txt
          python sigma_DCA_manager.py > sigma_log.txt 2>&1
          cat sigma_log.txt
          cat bear_log.txt sigma_log.txt > full_log.txt
      
      # Sync repository with generated logs
      - name: Sync results to repository
        run: |
          git config --global user.name "Investment Bot"
          git config --global user.email "bot@example.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "sync: $(date +'%Y-%m-%d')"
            git push
          fi
          
      # Send Discord notification (includes Summary Report)
      - name: Send Discord notification
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const webhook = process.env.DISCORD_WEBHOOK;
            const userId = process.env.DISCORD_USER_ID;
            
            try {
                // Extract only the "Summary Report" section from bear_log.txt
                const logData = fs.readFileSync('bear_log.txt', 'utf8');
                const target = 'Summary Report';
                const msg = logData.includes(target) ? target + logData.split(target)[1] : logData;
                
                const payload = {
                    content: `<@${userId}>\n📊 **Investment Engine Report**\n\`\`\`\n${msg.slice(-1800)}\n\`\`\``
                };
                
                await fetch(webhook, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (error) {
                console.error('Discord transmission failed:', error);
            }
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}