name: 매일 투자 엔진

on:
  schedule:
    - cron: "0 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-investment-engine:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      
      - run: pip install yfinance pandas requests numpy pytz holidays
      
      # [핵심] 스크립트를 실행하면서 결과를 log.txt에 저장합니다.
      - name: Run and Capture
        run: |
          {
            python bear_market_signals.py
            python sigma_DCA_manager.py
          } > full_log.txt 2>&1
      
      # 깃허브 동기화
      - name: Sync results
        run: |
          git config --global user.name "Automated Bot"
          git config --global user.email "bot@example.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "sync: $(date +'%Y-%m-%d')"
            git push
          fi
          
      # Discord로 결과 알림 (안전한 파이썬 스크립트 실행)
      - name: Send Discord notification
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
        run: |
          python - << 'EOF'
          import os
          import requests
          
          webhook = os.environ.get('DISCORD_WEBHOOK')
          user_id = os.environ.get('DISCORD_USER_ID')
          
          # full_log.txt 읽기 (없을 경우 대비)
          try:
              with open('full_log.txt', 'r', encoding='utf-8') as f:
                  log_content = f.read()
          except FileNotFoundError:
              log_content = "로그 파일을 찾을 수 없습니다."
          
          # 메시지 구성
          message = log_content[-1800:] # 내용 제한
          content = f"<@{user_id}>\n```\n{message}\n```"
          
          # 전송
          requests.post(webhook, json={"content": content})
          EOF