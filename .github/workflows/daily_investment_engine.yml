name: 매일 투자 엔진

on:
  schedule:
    - cron: "0 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-investment-engine:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      
      - run: pip install yfinance pandas requests numpy pytz holidays
      
      # [핵심] 두 스크립트의 출력을 각각 별도 파일에 저장합니다.
      # (한 파일에 이어 붙이면 "종합 리포트" 이후 텍스트를 자를 때
      #  뒤에 실행되는 sigma_DCA_manager.py의 로그까지 함께 잘려서 나옵니다.)
      - name: Run and Capture
        run: |
          python bear_market_signals.py > bear_log.txt 2>&1
          cat bear_log.txt
          python sigma_DCA_manager.py > sigma_log.txt 2>&1
          cat sigma_log.txt
          cat bear_log.txt sigma_log.txt > full_log.txt
      
      # 깃허브 동기화
      - name: Sync results
        run: |
          git config --global user.name "Automated Bot"
          git config --global user.email "bot@example.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "sync: $(date +'%Y-%m-%d')"
            git push
          fi
          
      # 3. Discord로 결과 알림 (요약 표 + 상세 내역 포함)
      - name: Send Discord notification
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const webhook = process.env.DISCORD_WEBHOOK;
            const userId = process.env.DISCORD_USER_ID;
            
            try {
                // "종합 리포트"는 bear_market_signals.py 로그에만 있으므로
                // 해당 로그에서만 잘라내어 sigma_DCA_manager.py 출력이 섞이지 않게 합니다.
                const logData = fs.readFileSync('bear_log.txt', 'utf8');
                const target = '종합 리포트';
                const msg = logData.includes(target) ? target + logData.split(target)[1] : logData;
                
                const payload = {
                    content: `<@${userId}>\n📊 **투자 엔진 리포트**\n\`\`\`\n${msg.slice(-1800)}\n\`\`\``
                };
                
                await fetch(webhook, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (error) {
                console.error('전송 실패:', error);
            }
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}