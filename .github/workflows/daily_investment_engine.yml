name: 매일 투자 엔진

on:
  schedule:
    - cron: "0 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-investment-engine:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      
      - run: pip install yfinance pandas requests numpy pytz holidays
      
      # [핵심] 스크립트를 실행하면서 결과를 log.txt에 저장합니다.
      - name: Run and Capture
        run: |
          {
            python bear_market_signals.py
            python sigma_DCA_manager.py
          } > full_log.txt 2>&1
      
      # 깃허브 동기화
      - name: Sync results
        run: |
          git config --global user.name "Automated Bot"
          git config --global user.email "bot@example.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "sync: $(date +'%Y-%m-%d')"
            git push
          fi
          
      # 3. Discord로 결과 알림 (요약 표 + 상세 내역 포함)
      - name: Send Discord notification
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
        run: |
          python - << 'EOF'
          import os, requests
          
          webhook = os.environ.get('DISCORD_WEBHOOK')
          user_id = os.environ.get('DISCORD_USER_ID')
          
          try:
              with open('full_log.txt', 'r', encoding='utf-8') as f:
                  log_content = f.read()
              
              start_marker = "종합 리포트"
              if start_marker in log_content:
                  # 상세 내용을 추출하고 깔끔하게 정리
                  clean_content = log_content.split(start_marker)[1].strip()
                  
                  # 메시지 본문을 구성합니다
