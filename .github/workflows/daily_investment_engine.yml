name: 매일 투자 엔진

on:
  schedule:
    - cron: "0 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-investment-engine:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      
      - run: pip install yfinance pandas requests numpy pytz holidays
      
      # [핵심] 스크립트를 실행하면서 결과를 log.txt에 저장합니다.
      - name: Run and Capture
        run: |
          {
            python bear_market_signals.py
            python sigma_DCA_manager.py
          } > full_log.txt 2>&1
      
      # 깃허브 동기화
      - name: Sync results
        run: |
          git config --global user.name "Automated Bot"
          git config --global user.email "bot@example.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "sync: $(date +'%Y-%m-%d')"
            git push
          fi
          
      # 3. Discord로 결과 알림 (요약 표 + 상세 내역 포함)
      - name: Send Discord notification
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
        run: |
          python -c "
          import os, requests
          
          webhook = os.environ.get('DISCORD_WEBHOOK')
          user_id = os.environ.get('DISCORD_USER_ID')
          
          # 로그 파일을 읽어옵니다. 없으면 빈 문자열 반환
          try:
              with open('full_log.txt', 'r', encoding='utf-8') as f:
                  log_data = f.read()
          except:
              log_data = '로그 파일을 찾을 수 없습니다.'
          
          # '종합 리포트'가 있는 위치부터 끝까지 자릅니다.
          target = '종합 리포트'
          if target in log_data:
              msg = target + log_data.split(target)[1]
          else:
              msg = log_data
          
          # 메시지 완성
          final_msg = f'<@{user_id}>\n📊 **투자 엔진 리포트**\n