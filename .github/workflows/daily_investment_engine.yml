name: 매일 투자 엔진

on:
  schedule:
    - cron: "0 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-investment-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      
      - run: pip install yfinance pandas requests numpy pytz holidays
      
      # 1. 스크립트 실행
      - name: Run scripts
        run: |
          python bear_market_signals.py
          python sigma_DCA_manager.py
      
      # 2. 결과 파일들을 깃허브로 동기화(Push)
      - name: Sync results to GitHub
        run: |
          git config --global user.name "Automated Bot"
          git config --global user.email "bot@example.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync investment data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
          
      # 3. Discord로 결과 알림 (env 설정 추가)
      - name: Send Discord notification
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
        run: |
          python -c "
          import os, requests
          webhook = os.environ.get('DISCORD_WEBHOOK')
          user_id = os.environ.get('DISCORD_USER_ID')
          content = f'<@{user_id}> 🤖 투자 엔진 가동 및 데이터 동기화 완료.'
          requests.post(webhook, json={'content': content})
          "