name: Bear Market Signals Engine

on:
  schedule:
    - cron: "0 23 * * 1-5"
  workflow_dispatch:

jobs:
  run-signals:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Sync with latest remote (start from newest state)
        # 체크아웃 직후 최신 원격 상태로 rebase — 스테일 상태 기준 변경 방지
        # ⚠️ 실패를 그대로 두면 리포트·푸시가 통째로 skipped 된다 (2026-09-23 러너 TLS 실패
        # 'server certificate verification failed. CAfile: none' 로 알림 런이 즉사).
        # ① 기본 pull → ② 시스템 CA 번들 명시 재시도 → ③ 그래도 실패하면 경고만 남기고 진행
        run: |
          if git pull --rebase; then exit 0; fi
          sleep 3
          CA=/etc/ssl/certs/ca-certificates.crt
          if [ -f "$CA" ] && git -c http.sslCAInfo="$CA" pull --rebase; then exit 0; fi
          echo "::warning::원격 동기화 실패 — 체크아웃(최신 커밋) 상태로 계속 진행합니다"
      - name: Set up Python
        uses: actions/setup-python@v5
        with: {python-version: '3.14'}
      - run: pip install -r requirements.txt
      
      - name: TypeScript strict typecheck (sw.js / OneSignalSDKWorker.js / dashboard inline JS)
        # JS 수정이 배포 전에 깨지지 않도록 검사 게이트 (2026-08-14)
        run: |
          npm ci --silent
          npm run typecheck
      
      - name: Run Market Signals
        # tee: Actions 로그에도 표시 + bear_log.txt 저장 (로그 표시 실패 방지)
        run: |
          set -o pipefail
          python bear_market_signals.py 2>&1 | tee bear_log.txt
        
      - name: Sync and Notify
        if: always()
        run: |
          git config --global user.name "Signals Bot"
          git config --global user.email "bot@example.com"
          # 상태 파일만 커밋 (로그는 저장하지 않음)
          # cape_cache.json 도 함께 커밋 — 러너는 일회성이라 커밋하지 않으면 캐시가 갱신되지 않고
          # 저장소 사본만 낡는다 (2026-09-20: 33일 동결돼 CAPE 폴백이 낡은 값을 쓸 위험이 있었다)
          [ -f "signal_report.json" ] && git add signal_report.json
          [ -f "cape_cache.json" ] && git add cape_cache.json
          git commit -m "update: signals $(date +'%Y-%m-%d')" || echo "No changes to commit"
          # -X theirs: 충돌 시 원격 버전 유지 — 봇 상태는 다음 실행에서 재생성.
          # pull 은 실패해도 계속 시도(|| true)하고, 상태 push 는 일시 네트워크/TLS 실패를
          # 3회까지 재시도해 흡수한다 — 최종 실패는 스텝 실패로 노출(2026-09-23 러너 TLS 실패 대응).
          # push 실패 시 인증서 검증 실패(CAfile: none) 대비 시스템 CA 번들 명시 재시도 포함.
          CA=/etc/ssl/certs/ca-certificates.crt
          ok=false
          for i in 1 2 3; do
            git pull --rebase -X theirs || true
            if git push; then ok=true; break; fi
            if [ -f "$CA" ] && git -c http.sslCAInfo="$CA" push; then ok=true; break; fi
            echo "::warning::signals 상태 push 실패 (시도 $i/3) — 3초 후 재시도"
            sleep 3
          done
          $ok || { echo "::error::signals 상태 push 3회 실패 — 이번 회차 상태가 저장되지 않았습니다"; exit 1; }
          
      - name: Send Discord notification
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const logData = fs.existsSync('bear_log.txt') ? fs.readFileSync('bear_log.txt', 'utf8') : "No logs generated.";
            const target = 'Summary Report';
            const msg = logData.includes(target) ? target + logData.split(target)[1] : logData;
            await fetch(process.env.DISCORD_WEBHOOK, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({content: `<@${process.env.DISCORD_USER_ID}>\n📊 **Market Signals Report**\n\`\`\`\n${msg.slice(-1800)}\n\`\`\``})
            });