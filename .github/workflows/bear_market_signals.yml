name: 베어마켓 조기 경보 시스템

on:
  schedule:
    # 매일 한국시간 오전 8시 실행 (UTC 23:00 = KST 08:00)
    - cron: "0 23 * * 1-5"   # 월~금 (주말 미국 시장 없음)
  workflow_dispatch:           # 수동 실행 버튼

jobs:
  run-bear-signals:
    runs-on: ubuntu-latest

    steps:
      # ── 1. 코드 체크아웃 ──────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python 환경 세팅 ───────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. 의존성 설치 ────────────────────────────────
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas requests

      # ── 4. 스크립트 실행 & 결과 저장 ─────────────────
      - name: Run bear market signals
        run: |
          python bear_market_signals.py > result.txt 2>&1
        continue-on-error: true   # 오류나도 Discord 알림은 전송

      # ── 5. Discord 알림 전송 ──────────────────────────
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
        run: |
          python - << 'PYEOF'
          import os, json, requests, datetime

          webhook_url = os.environ["DISCORD_WEBHOOK"]
          user_id     = os.environ["DISCORD_USER_ID"]
          mention     = f"<@{user_id}>"

          # result.txt 읽기
          try:
              with open("result.txt", "r", encoding="utf-8") as f:
                  raw = f.read().strip()
          except FileNotFoundError:
              raw = "result.txt 를 찾을 수 없습니다."

          # 리포트 본문 추출 (=== 구분선 기준)
          if "===" in raw:
              report_lines = raw[raw.index("==="):]
          else:
              report_lines = raw

          # Discord 메시지 2000자 제한 — 초과 시 잘라내기
          MAX = 1900
          if len(report_lines) > MAX:
              report_lines = report_lines[:MAX] + "\n...(이하 생략)"

          # 종합 판정 추출해서 제목에 표시
          verdict = "결과 확인 필요"
          for line in report_lines.splitlines():
              if "종합 판정" in line:
                  verdict = line.split(":")[-1].strip()
                  break

          today = datetime.date.today().strftime("%Y-%m-%d")
          content = (
              f"{mention}\n"
              f"**📊 베어마켓 조기 경보 — {today}**\n"
              f"**{verdict}**\n\n"
              f"```\n{report_lines}\n```"
          )

          payload = {"content": content}
          resp = requests.post(
              webhook_url,
              data=json.dumps(payload),
              headers={"Content-Type": "application/json"},
              timeout=15,
          )

          if resp.status_code in (200, 204):
              print("Discord 전송 성공")
          else:
              print(f"Discord 전송 실패: {resp.status_code} {resp.text}")
              exit(1)
          PYEOF
