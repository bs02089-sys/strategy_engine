name: SOXL 2σ Alert

on:
  schedule:
    # 미국 장 마감 후 실행 (한국 시간 기준 오전 7시 30분 = UTC 22:30)
    # ⚠️ 결측 재시도는 이 런 안에서 대기한다(최장 2시간) — 잡 시간 제한(기본 6시간) 안이다.
    - cron: '30 22 * * 1-5'   # 월~금
    # 매월 1일 00:00 UTC = 09:00 KST — 수신 경로(웹훅) 생존 확인 PING. 요일과 무관하게 돈다
    # (평일 알림만으로는 1일이 주말이면 핑이 빠진다).
    - cron: '0 0 1 * *'
  workflow_dispatch:           # 수동 실행도 가능

jobs:
  check-signal:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # 리포에 쓰는 단계가 없다 — 알림 전송만 한다
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy requests pyyaml

      - name: 월간 웹훅 PING (매월 1일)
        if: github.event.schedule == '0 0 1 * *'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK}}
        run: |
          # 수신 전용으로 쓰다 보면 웹훅이 무효화돼도 알 수 없다 — 전송 실패면 종료코드 1 로
          # 워크플로우를 실패시켜 GitHub 알림 메일이 2차 신호가 된다.
          python soxl_2sigma_alert.py --ping

      - name: Run SOXL 2σ Alert
        if: github.event.schedule != '0 0 1 * *'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK}}
        run: |
          # 결측으로 알림이 생략된 종목은 1시간 간격으로 2회 더 시도한다 (최장 2시간, 야후 일봉
          # 종가가 늦게 채워지는 경우 대응). 이미 알림을 보낸 종목은 재시도 대상에서 빠진다.
          python soxl_2sigma_alert.py --retry-wait 3600 --retry-attempts 2