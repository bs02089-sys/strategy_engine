name: SOXL 2σ Alert

# ⚠️ 공개(public) 저장소는 60일 동안 저장소 활동(커밋 등)이 없으면 GitHub 가 스케줄 실행을 자동으로
#    끈다 — 알림도 월간 PING 도 함께 멈추고, 이 워크플로우 실행은 '활동'으로 치지 않는다.
#    꺼지기 전에 GitHub 가 안내 메일을 보내니 놓치지 말 것. 꺼졌다면 Actions 탭에서 다시 켠다.
#    (비공개 저장소는 해당 없음)
on:
  schedule:
    # 미국 장 마감 후 실행 (한국 시간 기준 오전 7시 30분 = UTC 22:30)
    # ⚠️ 결측 재시도는 이 런 안에서 대기한다(최장 2시간) — 잡 시간 제한(timeout-minutes) 안이다.
    - cron: '30 22 * * 1-5'   # 월~금 (미국 휴장일은 스크립트가 알림 없이 종료)
    # 매월 1일 00:00 UTC = 09:00 KST — 수신 경로(웹훅) 생존 확인 PING. 요일과 무관하게 돈다
    # (평일 알림만으로는 1일이 주말이면 핑이 빠진다).
    - cron: '0 0 1 * *'
  workflow_dispatch:           # 수동 실행도 가능 (휴장일·주말에도 그대로 알림을 보낸다)

jobs:
  check-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 150       # 재시도 대기 최장 120분 + 여유 30분 — 넘으면 강제 종료(= 실패 메일)
    permissions:
      contents: read   # 리포에 쓰는 단계가 없다 — 알림 전송만 한다

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          # exchange-calendars: 휴장일·봉 미수신 검사용(없어도 동작은 하지만 두 검사가 조용히 꺼진다)
          pip install yfinance pandas numpy requests pyyaml exchange-calendars

      - name: 월간 웹훅 PING (매월 1일)
        if: github.event.schedule == '0 0 1 * *'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          # 수신 전용으로 쓰다 보면 웹훅이 무효화돼도 알 수 없다 — 전송 실패면 종료코드 1 로
          # 워크플로우를 실패시켜 GitHub 알림 메일이 2차 신호가 된다.
          python soxl_2sigma_alert.py --ping

      - name: Run SOXL 2σ Alert
        if: github.event.schedule != '0 0 1 * *'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          # 스케줄 실행에서만 휴장일을 건너뛴다 — 수동 실행(workflow_dispatch)은 항상 알림을 보낸다
          SKIP_FLAG: ${{ github.event_name == 'schedule' && '--skip-non-trading-day' || '' }}
        run: |
          # 결측·전송 실패한 종목은 1시간 간격으로 2회 더 시도한다 (최장 2시간). 결측은 재판정,
          # 전송 실패는 만들어 둔 메시지 재전송(재판정 없음)이라 같은 세션이 두 번 알림되지 않는다.
          # 끝내 전달하지 못하면 종료코드 1 → 워크플로우 실패(GitHub 메일)가 2차 신호다.
          python soxl_2sigma_alert.py --retry-wait 3600 --retry-attempts 2 $SKIP_FLAG