name: trade_alert

on:
  # VS Code에서 수정 후 푸시하면 바로 실행 (수동 테스트용)
  push:
    branches:
      - main

  # 정기 실행 (평일만)
  schedule:
    - cron: '0 0 * * 1-5'    # KST 오전 9시 (UTC 00:00)
    - cron: '0 10 * * 1-5'   # KST 오후 7시 (UTC 10:00)

  # GitHub에서 수동 실행
  workflow_dispatch:
    inputs:
      manual_reason:
        description: '수동 실행 이유 (선택)'
        required: false
        default: 'VS Code 수동 테스트'

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8

jobs:
  trade_alert:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.vscode_push_token_2026 }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin git@github.com:bs02089-sys/strategy_engine.git

      - name: Python 3.12 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 패키지 설치
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Discord 알림 실행
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          # TICKER: ${{ secrets.TICKER }}     # 필요하면 추가
        run: python trade_alert.py

      - name: 실행 로그 커밋 & 푸시
        if: always()
        run: |
          if [ -f trade_alert.log ]; then
            git add -f trade_alert.log
            git commit -m "chore: trade_alert 실행 로그 업데이트 ($(date -u +'%Y-%m-%d %H:%M UTC'))" || echo "No changes to commit"
            git push
          else
            echo "trade_alert.log 파일이 없습니다."
          fi
