name: Scrapling Docker Build

# Dockerfile 이 정말로 브라우저 시스템 라이브러리 문제를 해결하는지
# GitHub 러너(Docker 포함)에서 실제로 빌드·실행해 검증한다.
#
# 로컬 개발 환경(WSL)에는 컨테이너 런타임이 없어 빌드를 돌릴 수 없으므로
# 검증은 이 워크플로우가 담당한다. 검증 포인트는 세 가지다.
#   1. 이미지가 빌드되는가
#   2. 로컬 우회책(.browser-libs) 없이 동작하는가
#   3. stealthy 모드가 실제로 Cloudflare 를 통과해 200 을 받는가

on:
  push:
    paths:
      - 'scrapling-project/**'
      - '.github/workflows/scrapling_docker.yml'
  pull_request:
    paths:
      - 'scrapling-project/**'
  workflow_dispatch:

# 같은 브랜치에서 중복 실행되면 이전 실행을 취소한다 (이미지 빌드가 무겁다)
concurrency:
  group: scrapling-docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 러너 디스크 확보
        # Playwright 이미지는 수 GB 라서 기본 러너 디스크로는 빠듯하다.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: 이미지 빌드
        working-directory: scrapling-project
        run: docker build -t scrapling-demo .

      - name: 이미지 크기 확인
        run: docker images scrapling-demo --format '{{.Repository}}:{{.Tag}}  {{.Size}}'

      - name: 우회책이 이미지에 없음을 확인
        # 이 프로젝트의 로컬 우회책 .browser-libs 가 이미지 안에 없어야
        # "시스템 라이브러리만으로 동작한다"고 주장할 수 있다.
        run: |
          docker run --rm --entrypoint sh scrapling-demo -c \
            'test ! -e /app/.browser-libs && echo "OK: /app/.browser-libs 없음"'

      - name: static 모드 (오프라인 스모크 테스트)
        working-directory: scrapling-project
        run: |
          mkdir -p ci-output
          docker run --rm -v "$PWD/ci-output:/app/output" scrapling-demo \
            python main.py -m static

      - name: stealthy 모드 실행 (Cloudflare 우회)
        working-directory: scrapling-project
        run: |
          mkdir -p ci-output
          docker run --rm -v "$PWD/ci-output:/app/output" scrapling-demo \
            python main.py -m stealthy 2>&1 | tee stealthy.log

      - name: 결과 검증
        # main.py 는 stealthy 실패 시에도 exit 0 으로 끝나고 ok=false 를 남긴다.
        # 따라서 종료코드가 아니라 결과 JSON 을 검사해야 실제 검증이 된다.
        working-directory: scrapling-project
        run: |
          python3 - <<'PY'
          import json, pathlib, sys

          results = pathlib.Path("ci-output/results.json")
          if not results.exists():
              print("::error::results.json 이 생성되지 않았습니다")
              sys.exit(1)

          stealthy = json.loads(results.read_text()).get("stealthy", {})
          summary = {k: v for k, v in stealthy.items() if k != "sample_links"}
          print("stealthy 결과:", summary)

          if not stealthy.get("ok") or stealthy.get("status") != 200:
              print("::error::stealthy 모드가 200 을 받지 못했습니다")
              sys.exit(1)

          print("검증 통과: 이미지 안에서 Cloudflare 우회 성공 (HTTP 200)")
          PY

      - name: 실패 시 브라우저 로그 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scrapling-stealthy-log
          path: scrapling-project/stealthy.log
          if-no-files-found: ignore
