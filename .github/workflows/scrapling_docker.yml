name: Scrapling Docker Build

# Dockerfile 이 정말로 브라우저 시스템 라이브러리 문제를 해결하는지
# GitHub 러너(Docker 포함)에서 실제로 빌드·실행해 검증한다.
#
# 로컬 개발 환경(WSL)에는 컨테이너 런타임이 없어 빌드를 돌릴 수 없으므로
# 검증은 이 워크플로우가 담당한다. 검증 포인트는 네 가지다.
#   1. 이미지가 빌드되는가
#   2. 로컬 우회책(.browser-libs) 없이 동작하는가
#   3. adaptive 모드가 실패하는 selector 를 재탐색으로 복구하는가
#   4. stealthy 모드가 실제로 Cloudflare 를 통과해 200 을 받는가
#
# 실행 시간은 측정에 근거해 잡았다 (자세한 수치는 아래 스텝 주석 참고).
#   디스크 정리 스텝 제거 : 46초 -> 0초 (러너에 105G 여유가 있었다)
#   빌드 캐시(type=gha)   : 도입했다가 되돌림. 캐시 적중 58초 vs 순수 빌드 34초

on:
  push:
    paths:
      - 'scrapling-project/**'
      - '.github/workflows/scrapling_docker.yml'
  pull_request:
    paths:
      - 'scrapling-project/**'
  workflow_dispatch:

# 같은 브랜치에서 중복 실행되면 이전 실행을 취소한다 (이미지 빌드가 무겁다)
concurrency:
  group: scrapling-docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 러너 디스크 확인
        # 실측 결과 ubuntu-24.04 러너는 145G 중 105G 가 비어 있었다.
        # 예전에 여기서 디스크를 비웠는데, 그 스텝 하나가 46초를 잡아먹었을 뿐
        # 이미지(2.74GB)에는 전혀 필요 없었으므로 진단 출력만 남긴다.
        run: df -h /

      - name: 이미지 빌드
        # 기본 docker build 를 쓴다. buildx + type=gha 캐시도 시험해 봤으나
        # 베이스 이미지 레이어가 buildkit 컨테이너 안에만 존재해서,
        # load:true 로 로컬 데몬에 옮기는 데만 약 55초가 걸렸다.
        # MCR 에서 직접 받는 시간(약 23초)보다 비싸므로 캐시가 역효과였다.
        #   - 캐시 미적중: 146초
        #   - 캐시 적중  :  58초
        #   - 기본 빌드  :  34초 (베이스 pull 23초 + pip 설치 6초)
        working-directory: scrapling-project
        run: docker build -t scrapling-demo .

      - name: 이미지 크기 확인
        run: docker images scrapling-demo --format '{{.Repository}}:{{.Tag}}  {{.Size}}'

      - name: 우회책이 이미지에 없음을 확인
        # 이 프로젝트의 로컬 우회책 .browser-libs 가 이미지 안에 없어야
        # "시스템 라이브러리만으로 동작한다"고 주장할 수 있다.
        run: |
          docker run --rm --entrypoint sh scrapling-demo -c \
            'test ! -e /app/.browser-libs && echo "OK: /app/.browser-libs 없음"'

      - name: static 모드 (오프라인 스모크 테스트)
        working-directory: scrapling-project
        run: |
          mkdir -p ci-output-static
          docker run --rm -v "$PWD/ci-output-static:/app/output" scrapling-demo \
            python main.py -m static 2>&1 | tee static.log

      - name: adaptive 모드 실행 (적응형 재탐색)
        # 네트워크를 쓰므로 실패하면 여기서 드러난다.
        # fingerprint 저장 -> selector 파손 -> adaptive 재탐색 흐름을 검증한다.
        working-directory: scrapling-project
        run: |
          mkdir -p ci-output-adaptive
          docker run --rm -v "$PWD/ci-output-adaptive:/app/output" scrapling-demo \
            python main.py -m adaptive 2>&1 | tee adaptive.log

      - name: stealthy 모드 실행 (Cloudflare 우회)
        working-directory: scrapling-project
        run: |
          mkdir -p ci-output-stealthy
          docker run --rm -v "$PWD/ci-output-stealthy:/app/output" scrapling-demo \
            python main.py -m stealthy 2>&1 | tee stealthy.log

      - name: 결과 검증
        # main.py 는 각 모드 실패 시에도 exit 0 으로 끝나고 ok=false / 0건을 남긴다.
        # 따라서 종료코드가 아니라 결과 JSON 을 검사해야 실제 검증이 된다.
        working-directory: scrapling-project
        run: |
          python3 - <<'PY'
          import json, pathlib, sys

          failures = []

          def load(path):
              file = pathlib.Path(path)
              if not file.exists():
                  print(f"::error::{path} 이 생성되지 않았습니다")
                  sys.exit(1)
              return json.loads(file.read_text())

          # 1) adaptive: 저장 -> selector 파손 -> 재탐색 복구
          adaptive = load("ci-output-adaptive/results.json")["adaptive"]
          print("adaptive:", {k: v for k, v in adaptive.items() if k != "quotes"})
          if adaptive["saved_count"] <= 0:
              failures.append("저장 단계가 요소를 저장하지 못했습니다")
          if adaptive["broken_selector_matches"] != 0:
              failures.append("깨진 selector 가 매칭되었습니다 — 검증 전제가 무너짐")
          if adaptive["recovered_count"] <= 0:
              failures.append("adaptive 재탐색이 요소를 복구하지 못했습니다")
          if not adaptive["first_item_preserved"]:
              failures.append("복구된 요소가 저장 시점과 다릅니다")

          # 2) stealthy: Cloudflare 우회
          stealthy = load("ci-output-stealthy/results.json")["stealthy"]
          print("stealthy:", {k: v for k, v in stealthy.items() if k != "sample_links"})
          if not stealthy.get("ok") or stealthy.get("status") != 200:
              failures.append("stealthy 모드가 200 을 받지 못했습니다")

          for message in failures:
              print(f"::error::{message}")
          if failures:
              sys.exit(1)

          print("검증 통과: adaptive 재탐색 + stealthy Cloudflare 우회")
          PY

      - name: 실패 시 로그 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scrapling-logs
          path: |
            scrapling-project/static.log
            scrapling-project/adaptive.log
            scrapling-project/stealthy.log
          if-no-files-found: ignore
