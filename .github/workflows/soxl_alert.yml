name: SOXL 2σ Alert

on:
  schedule:
    # 미국 장 마감 후 실행 (한국 시간 기준 오전 6시 30분 = UTC 21:30)
    - cron: '30 21 * * 1-5'   # 월~금
  workflow_dispatch:           # 수동 실행도 가능

jobs:
  check-signal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy requests pyyaml

      - name: Run SOXL 2σ Alert
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK}}
        run: |
          python soxl_2sigma_alert.py