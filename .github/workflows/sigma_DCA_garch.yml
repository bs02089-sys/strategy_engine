name: Sigma DCA GARCH Manager

on:
  schedule:
    - cron: "15 23 * * 1-5" 
  workflow_dispatch:

jobs:
  run-dca-manager:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests numpy pytz pandas_market_calendars arch
      
      - name: Run GARCH DCA Manager
        run: python sigma_DCA_garch_v1.py > sigma_DCA_garch_log.txt 2>&1
        
      - name: Sync and Notify
        if: always()
        run: |
          git config --global user.name "DCA GARCH Bot"
          git config --global user.email "bot@example.com"
          
          [ -f "sigma_DCA_garch_log.txt" ] && git add sigma_DCA_garch_log.txt
          [ -f "portfolio_config_DCA_garch.json" ] && git add portfolio_config_DCA_garch.json
          [ -f "sigma_history.csv" ] && git add sigma_history.csv
          
          git commit -m "update: garch-dca-log $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push