name: daily_sigma_alert

on:
  # 정기 실행 (평일)
  schedule:
    - cron: '0 0 * * 1-5'    # KST 오전 9시
    - cron: '0 10 * * 1-5'   # KST 오후 7시

  # 수동 실행
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8

jobs:
  daily_sigma_alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.vscode_push_token_2026 }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin git@github.com:bs02089-sys/strategy_engine.git

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run SOXL Sigma Alert
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
        run: python SOXL_sigma_alert.py

      - name: 실행 로그 커밋 & 푸시 (실패해도 OK)
        if: always()
        continue-on-error: true
        run: |
          if [ -f sigma_alert.log ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            
            git add -f sigma_alert.log || true
            
            git commit -m "chore: daily_sigma_alert 실행 로그 업데이트 ($(date -u +'%Y-%m-%d %H:%M UTC'))" || echo "No changes to commit"
            
            git push --force-with-lease || git push || echo "로그 푸시 실패 (무시)"
          else
            echo "sigma_alert.log 파일이 없습니다. (처음 실행 시 정상)"
          fi
