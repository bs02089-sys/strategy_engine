name: Swing Alerter

on:
  schedule:
    # 월~금 00:00 UTC = 09:00 KST — 한국 아침 9시 고정 일일 브리핑 (2026-08-13)
    - cron: "0 0 * * 1-5"
  repository_dispatch:
    types: [swing-monitor]   # cron-job.org 실시간 알림 발사 (매수 구간 도달/임박/매도)
  workflow_dispatch:          # 수동 실행 지원

concurrency:
  group: swing-alerter        # 일일 브리핑 ↔ 실시간 폴링 직렬화
  cancel-in-progress: false

jobs:
  run-swing-alerter:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
      ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
      ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync with latest remote (start from newest state)
        run: git pull --rebase

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt

      - name: TypeScript strict typecheck (sw.js / OneSignalSDKWorker.js / dashboard inline JS)
        # 대시보드 인라인 JS(swing_alerter.py 상수)까지 npm run typecheck 로 검사 —
        # JS 수정이 배포 전에 깨지지 않도록 게이트 역할 (2026-08-14)
        run: |
          npm ci --silent
          npm run typecheck

      - name: Run Realtime Swing Monitor (from cron-job.org dispatch)
        if: github.event_name == 'repository_dispatch'
        # 실시간 모니터 — 변경분(매수 구간 도달/임박/매도)만 Discord 발송.
        # --monitor 가 장중 실시간 가격을 반영한 대시보드 HTML 도 저장한다 (2026-08-11)
        # → Sync 단계가 /tmp 로 보존해 Deploy 단계가 gh-pages 에 재배포.
        run: |
          set -o pipefail
          python swing_alerter.py --monitor 2>&1 | tee swing_log.txt

      - name: Run Daily Swing Briefing
        if: github.event_name != 'repository_dispatch'
        # 일일 브리핑 + 대시보드 HTML 갱신 (모바일 확인용)
        run: |
          set -o pipefail
          python swing_alerter.py --discord 2>&1 | tee swing_log.txt

      - name: Show log on failure
        if: failure()
        run: cat swing_log.txt

      - name: Sync and Notify
        if: always()
        run: |
          git config --global user.name "Swing Bot"
          git config --global user.email "bot@example.com"

          # 대시보드는 main에 커밋하지 않는다 — 생성 파일(헤더 시각 등)이 봇/사용자
          # 양쪽에서 재생성되어 git pull 충돌을 반복하는 문제 방지.
          # 신선한 사본은 /tmp로 보존해 Deploy 단계가 gh-pages에만 반영한다.
          # ⚠️ git checkout -- swing_dashboard.html 을 하지 말 것 — 파일이 gitignore/미추적이라
          # pathspec 오류(exit 1)로 bash -e 스텝이 즉시 실패한다 (2026-08-11 수동 실행에서 확인).
          # 미추적 파일이라 커밋될 일도 없으므로 추가 조치가 필요 없다.
          [ -f "swing_dashboard.html" ] && cp swing_dashboard.html /tmp/swing_dash.html

          # 봇 전용 상태 파일만 커밋 — 설정(swing_config.json)은 사용자 소유라 건드리지 않는다.
          # 상태/설정이 별도 파일로 분리되어 봇·사용자 git 충돌이 상태를 유실시킬 수 없다.
          [ -f "swing_state.json" ] && git add swing_state.json

          git commit -m "update: swing-state $(date +'%Y-%m-%d')" || echo "No changes to commit"
          # -X theirs: 안전망 — 상태가 별도 파일(swing_state.json)에 있어 사용자 설정과
          # 충돌할 일이 없지만, 만에 하나를 대비해 원격(사람) 버전을 유지한다.
          # || true: 일시적 실패(네트워크 등) 시에도 push는 계속 시도해 갱신 유실을 방지
          git pull --rebase -X theirs || true
          git push

      - name: Deploy Dashboard to GitHub Pages (gh-pages branch)
        # 일일/수동/장중 디스패치 모두 재배포 — 장중 실시간 가격을 스마트폰 앱에서 보려면
        # 디스패치마다 신선한 대시보드를 gh-pages 에 올려야 한다 (2026-08-11)
        if: always()
        # set -e: push 실패 시 스텝이 조용히 성공 처리되지 않도록 즉시 실패시킴
        run: |
          set -e
          # 대시보드 생성이 실패한 실행에선 배포를 건너뛴다 — 이전 gh-pages 유지
          [ -f /tmp/swing_dash.html ] || { echo "대시보드 없음 — 배포 생략"; exit 0; }
          git config --global user.name "Swing Bot"
          git config --global user.email "bot@example.com"

          # 브랜치 전환 시 워킹트리에서 사라지므로 임시 저장 (PWA 파일)
          # 대시보드(/tmp/swing_dash.html)는 Sync 단계가 보존한 신선한 사본 사용
          cp swing_manifest.webmanifest /tmp/swing_manifest.webmanifest
          cp swing_icon.png /tmp/swing_icon.png
          cp sw.js /tmp/sw.js
          cp OneSignalSDKWorker.js /tmp/OneSignalSDKWorker.js

          # 기존 gh-pages 가 있으면 그 위에, 없으면 main 기준 빈 브랜치로 생성
          git fetch origin gh-pages:refs/remotes/origin/gh-pages 2>/dev/null || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git checkout -B gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf --quiet . 2>/dev/null || true
          fi

          # 구버전 아이콘(원본/v2 계열)은 swing_icon.png 로 통합 — gh-pages 에서 정리
          git rm --ignore-unmatch swing_icon.png swing_icon_192.png swing_icon_v2.png swing_icon_192_v2.png 2>/dev/null || true

          # 대시보드를 index.html 로 배포 (사이트 루트에서 바로 열림) + PWA 파일
          cp /tmp/swing_dash.html index.html
          cp /tmp/swing_manifest.webmanifest manifest.webmanifest
          cp /tmp/swing_icon.png swing_icon.png
          cp /tmp/sw.js sw.js
          cp /tmp/OneSignalSDKWorker.js OneSignalSDKWorker.js
          git add index.html manifest.webmanifest swing_icon.png sw.js OneSignalSDKWorker.js
          if git diff --quiet --cached origin/gh-pages >/dev/null 2>&1; then
            echo "변경 없음 — 배포 생략"
          else
            git commit -m "deploy: swing dashboard $(date +'%Y-%m-%d')"
            git push origin gh-pages --force
          fi
          git checkout main || true
