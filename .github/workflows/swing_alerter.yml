name: Swing Alerter

on:
  schedule:
    # 월~금 23:40 UTC = 19:40 ET (장 마감 후) — DCA 브리핑(23:30) 직후 스윙 일일 브리핑
    - cron: "40 23 * * 1-5"
  repository_dispatch:
    types: [swing-monitor]   # cron-job.org 실시간 알림 발사 (매수 구간 도달/임박/매도)
  workflow_dispatch:          # 수동 실행 지원

concurrency:
  group: swing-alerter        # 일일 브리핑 ↔ 실시간 폴링 직렬화
  cancel-in-progress: false

jobs:
  run-swing-alerter:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync with latest remote (start from newest state)
        run: git pull --rebase

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt

      - name: Run Realtime Swing Monitor (from cron-job.org dispatch)
        if: github.event_name == 'repository_dispatch'
        # 실시간 모니터 — 변경분(매수 구간 도달/임박/매도)만 Discord 발송
        run: |
          set -o pipefail
          python swing_alerter.py --monitor 2>&1 | tee swing_log.txt

      - name: Run Daily Swing Briefing
        if: github.event_name != 'repository_dispatch'
        # 일일 브리핑 + 대시보드 HTML 갱신 (모바일 확인용)
        run: |
          set -o pipefail
          python swing_alerter.py --discord 2>&1 | tee swing_log.txt

      - name: Show log on failure
        if: failure()
        run: cat swing_log.txt

      - name: Sync and Notify
        if: always()
        run: |
          git config --global user.name "Swing Bot"
          git config --global user.email "bot@example.com"

          # 상태/대시보드 파일만 커밋 (로그/히스토리는 저장하지 않음)
          [ -f "swing_config.json" ] && git add swing_config.json
          [ -f "swing_dashboard.html" ] && git add swing_dashboard.html

          git commit -m "update: swing-state $(date +'%Y-%m-%d')" || echo "No changes to commit"
          # -X theirs: 충돌 시 원격(사람) 버전을 유지 — 봇의 스테일 상태는 버리고 다음 실행에서 재생성.
          # || true: 일시적 실패(네트워크 등) 시에도 push는 계속 시도해 갱신 유실을 방지
          git pull --rebase -X theirs || true
          git push

      - name: Deploy Dashboard to GitHub Pages (gh-pages branch)
        # 일일/수동 실행에서만 배포 (실시간 폴링 dispatch 에서는 배포 안 함)
        # 스마트폰에서 어디서나 접속: GitHub Pages 로 대시보드 공개
        if: github.event_name != 'repository_dispatch'
        # set -e: push 실패 시 스텝이 조용히 성공 처리되지 않도록 즉시 실패시킴
        run: |
          set -e
          git config --global user.name "Swing Bot"
          git config --global user.email "bot@example.com"

          # 브랜치 전환 시 워킹트리에서 사라지므로 임시 저장 (대시보드 + PWA 파일)
          cp swing_dashboard.html /tmp/swing_dash.html
          cp swing_manifest.webmanifest /tmp/swing_manifest.webmanifest
          cp swing_icon.png /tmp/swing_icon.png

          # 기존 gh-pages 가 있으면 그 위에, 없으면 main 기준 빈 브랜치로 생성
          git fetch origin gh-pages:refs/remotes/origin/gh-pages 2>/dev/null || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git checkout -B gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf --quiet . 2>/dev/null || true
          fi

          # 대시보드를 index.html 로 배포 (사이트 루트에서 바로 열림) + PWA 파일
          cp /tmp/swing_dash.html index.html
          cp /tmp/swing_manifest.webmanifest manifest.webmanifest
          cp /tmp/swing_icon.png swing_icon.png
          git add index.html manifest.webmanifest swing_icon.png
          if git diff --quiet --cached origin/gh-pages >/dev/null 2>&1; then
            echo "변경 없음 — 배포 생략"
          else
            git commit -m "deploy: swing dashboard $(date +'%Y-%m-%d')"
            git push origin gh-pages --force
          fi
          git checkout main || true
