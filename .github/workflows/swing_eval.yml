name: Swing Bot Performance Evaluation

on:
  schedule:
    # 매월 1일 09:00 UTC — 월간 실전 신호 성과 요약을 Discord로 전송
    - cron: "0 9 1 * *"
  workflow_dispatch:           # 수동 실행 지원 (언제든 평가 가능)

concurrency:
  group: swing-eval
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync with latest remote (start from newest state)
        run: git pull --rebase

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt

      - name: Evaluate signal performance
        # 미청산 포지션 현재가 반영 + 월별 스냅샷 저장 + Discord 전송.
        # --since all 명시: 로컬에서 --since 3m 등으로 실행해도 같은 달 키로
        # CI 월간 스냅샷이 덮어써지지 않도록 CI는 항상 전체 기간으로 저장한다.
        run: |
          set -o pipefail
          python swing_bot_eval.py --save --since all --discord 2>&1 | tee eval_log.txt

      - name: Show output on failure
        if: failure()
        run: cat eval_log.txt

      - name: Commit and push performance snapshot
        # 평가 결과(swing_performance.json)를 저장소에 반영 — 실전 성과 이력 자동 누적
        run: |
          git config --global user.name "Swing Eval Bot"
          git config --global user.email "bot@example.com"

          [ -f "swing_performance.json" ] && git add swing_performance.json

          git commit -m "update: swing-performance $(date +'%Y-%m')" || echo "No changes to commit"
          git pull --rebase -X theirs || true
          git push
