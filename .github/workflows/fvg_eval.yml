name: FVG Eval Report (Discord)

on:
  schedule:
    # 한국 아침 08:00(KST) = UTC 23:00(전일) — 미국 장 마감(16:00 ET = 20:00 UTC)
    # 이후 전일 청산 결과가 fvg_positions.json에 확정되므로, 아침에 어제 하루의
    # 성과(승률/PF/총수익/MDD/청산 분포)를 요약 전송한다.
    # 월~금(UTC) = 화~토 아침 KST — 주말(일/월 아침)엔 전송 없음.
    - cron: "0 23 * * 1-5"
  workflow_dispatch:           # 수동 실행 지원 (테스트용)

concurrency:
  group: fvg-eval              # 실행 직렬화 — 중복 실행 방지
  cancel-in-progress: false

jobs:
  eval-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write          # fvg_eval_state.json 동기화 커밋/푸시용
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

    steps:
      - name: Checkout repository
        # fvg_positions.json은 fvg_signal.yml(5분 폴링)이 매 실행마다 커밋하므로
        # 체크아웃으로 최신 실전 기록을 받아온다 (로컬 크론 기록도 git 동기화됨).
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # fvg_bot_eval.py는 표준 라이브러리(urllib)만 사용 — pip install 불필요 (빠른 실행)
      - name: Run eval report and send to Discord (--discord)
        # 수수료 기본값(나무멤버스 0.07% 왕복) 자동 반영.
        # --discord: 리포트 요약(통계/분포/종목별/최근 10건)을 Discord로 전송.
        run: python fvg_bot_eval.py --discord

      # 월간 자동 트리거 — 첫 트레이드일부터 20영업일(평일) 경과 시점마다
      # 월간 요약을 Discord로 전송한다. 마지막 전송일은 fvg_eval_state.json에
      # 기록되므로 한 번 보낸 주기에는 다시 보내지 않는다 (아래 sync 스텝이 git 반영).
      # if: always(): 일일 리포트 스텝이 실패해도 트리거는 독립 실행되도록 보장
      - name: Monthly summary trigger (every 20 trading days)
        if: always()
        run: python fvg_bot_eval.py --monthly-trigger

      - name: Sync eval state and push
        # 트리거 상태(fvg_eval_state.json)를 커밋/푸시해 로컬/GHA가 공유한다.
        # 변경 없으면 "No changes to commit" 로그만 남고 종료.
        # || true: 일시적 네트워크 실패에도 push를 계속 시도해 갱신 유실 방지.
        if: always()
        run: |
          git config --global user.name "FVG Eval Bot"
          git config --global user.email "bot@example.com"

          [ -f fvg_eval_state.json ] && git add fvg_eval_state.json

          git commit -m "update: fvg-eval-state $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git pull --rebase -X theirs || true
          git push
