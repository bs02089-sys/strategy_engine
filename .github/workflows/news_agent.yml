name: news_agent

on:
  push:
    branches:
      - main
    paths:
      - news_agent.py
      
  schedule:
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

# 💡 [경고 해결] 여기에 환경 변수를 선언해 두면 actions/checkout@v4가 
# 다가오는 6월 변경안에 맞춰 Node.js 24 위에서 경고 없이 깔끔하게 실행됩니다.
env:
  PYTHONIOENCODING: utf-8
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  news_agent:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0 

      - name: Configure Git (표준 오리진 주소 및 유저 설정)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://github.com/${{ github.repository }}.git"

      - name: Sync latest data
        run: |
          git pull origin main || echo "Already up to date or no remote changes."

      - name: Python 3.12 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 패키지 설치
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install numpy pandas requests yfinance pytz google-genai python-dotenv
          fi

      - name: Discord 알림 실행
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python news_agent.py

      - name: 실행 결과 최종 커밋 & 푸시
        if: always()
        run: |
          if [ -f config.json ]; then
            git add config.json
          fi
          
          if ! git diff --cached --quiet; then
            git commit -m "chore: news_agent 실행 후 config.json 자동 동기화 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push --force-with-lease || git push
            echo "🚀 GitHub Actions 기준 설정 데이터 최종 Push 성공."
          else
            echo "✅ 새로 변경된 설정 데이터가 없어 동기화를 건너뜁니다."
          fi