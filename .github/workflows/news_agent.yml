name: news_agent

on:
  schedule:
    - cron: '0 0 * * *'   # 한국시간 오전 9시 (UTC 00:00)
    - cron: '0 10 * * *'  # 한국시간 오후 7시 (UTC 10:00)
  workflow_dispatch:        # 수동 실행 버튼

jobs:
  run-news_agent:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 패키지 설치
        run: pip install -r requirements.txt

      - name: 🚀 뉴스 에이전트 실행
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -c "from news_agent import run_agent; run_agent()"
