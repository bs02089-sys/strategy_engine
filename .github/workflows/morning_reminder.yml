name: Morning Reminder

# ⏰ 2026-08-12(수) 09:05 KST 1회용 아침 리마인더
#   → ① LS증권 타사출고 신청 (TQQQ 6주 → 나무증권 1번)
#     ② 나무증권 외화이체 (달러 입금 / 기본예탁금 충족)
# 날짜 가드: 2026-08-12(UTC) 이외엔 no-op — 8/13 이후 이 파일 삭제 가능.
# 2026-08-12 단독 사용 전환 — 전체 구독자(Subscribed Users) = 내 기기만 수신 (AGENTS.md 갱신).
on:
  schedule:
    # 00:05 UTC = 09:05 KST — 정각(00:00) 큐 지연 회피
    - cron: "5 0 * * *"
  workflow_dispatch:   # 수동 테스트용

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    env:
      ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
      ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Send OneSignal reminder push (one-shot 2026-08-12)
        run: |
          set -e
          # 1회용 — 지정일(UTC 기준)만 발송, 그 외 날짜는 조용히 종료
          if [ "$(date -u +%F)" != "2026-08-12" ]; then
            echo "Reminder day 아님 — skip (2026-08-12 전용)"
            exit 0
          fi
          python3 - <<'PY'
          import json, os, requests

          # 🔧 app_id는 공개값(대시보드 SDK에도 포함) — swing_config.json(설정 단일 소스) 우선,
          # env(시크릿) 폴백. strip 필수: 시크릿에 붙은 개행/공백이 남아 있으면
          # 'app_id is present but malformed' 400 이 발생한다 (2026-08-12 실패 원인).
          cfg = {}
          try:
              cfg = json.load(open("swing_config.json"))
          except Exception:
              pass
          app_id = (cfg.get("ONESIGNAL_APP_ID") or os.environ.get("ONESIGNAL_APP_ID", "")).strip()
          api_key = (os.environ.get("ONESIGNAL_REST_API_KEY") or "").strip()
          if not app_id:
              raise SystemExit("ONESIGNAL_APP_ID 미설정 — swing_config.json 또는 GitHub 시크릿 확인")
          if not api_key:
              raise SystemExit("ONESIGNAL_REST_API_KEY 미설정 — GitHub 시크릿 확인")

          try:
              pages = cfg.get("PAGES_URL", "")
          except Exception:
              pages = ""

          # 개인 전용 발송 (2026-08-12 확정): 'Subscribed Users' 세그먼트는 새 User Model(v2)
          # 구독을 제때 집계하지 못해 0명으로 나왔다 (구독 자체는 enabled=true 로 등록 확인됨).
          # → 세그먼트 계산을 건너뛰고 외부 ID(동기화 코드)로 직접 대상 지정해 100% 전달.
          # 외부 ID: bs0208 = 앱에서 입력한 동기화 코드 (OneSignal 사용자 c33eb986).
          payload = {
              "app_id": app_id,
              "target_channel": "push",
              "headings": {"en": "⏰ 아침 리마인더 — 타사출고 + 외화이체"},
              "contents": {"en":
                  "① LS증권 타사출고 신청: TQQQ 6주 → 나무증권 1번\n"
                  "   (취득단가 $73.97 증빙 먼저 확보)\n"
                  "② 나무증권 외화이체: 달러 입금 (기본예탁금 1천만원)\n"
                  "둘 다 오전 영업시간 안에!"},
              "include_aliases": {"external_id": ["bs0208"]},
          }
          if pages:
              payload["url"] = pages

          # OneSignal 인증: 신형 앱 키(os_v2_app_…)는 'Key', 구형 REST 키는 'Basic'
          # → 키 형식(prefix)으로 우선 순위 결정, 401/403(인증·권한 오류)이면 다른 형식으로 재시도.
          # (Basic을 신형 키로 보내면 401이 아닌 403이 나올 수 있어 폴백이 발동 안 하던 문제 — 2026-08-12)
          schemes = (("Key", "Basic") if api_key.startswith("os_v2_") else ("Basic", "Key"))
          for scheme in schemes:
              r = requests.post(
                  "https://api.onesignal.com/notifications",
                  headers={"Authorization": f"{scheme} {api_key}",
                           "Content-Type": "application/json; charset=utf-8"},
                  json=payload,
                  timeout=15,
              )
              print(f"  [{scheme} 시도] HTTP {r.status_code}: {r.text[:200]}")
              if r.status_code not in (401, 403):
                  print(f"HTTP {r.status_code}: {r.text[:400]}")
                  r.raise_for_status()
                  break
          else:
              raise SystemExit("인증 실패 (Basic/Key 모두 401/403) — API 키가 현재 앱(fc892714)의 키인지 확인")
          PY
