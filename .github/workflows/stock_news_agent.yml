name: stock_news_agent

on:
  schedule:
    - cron: '0 0 * * *'   # 한국시간 오전 9시 (UTC 00:00)
    - cron: '0 10 * * *'  # 한국시간 오후 7시 (UTC 10:00)
  workflow_dispatch:        # 수동 실행 버튼

jobs:
  run-news_stock_agent:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 패키지 설치
        run: pip install -r requirements.txt

      - name: 🔑 config.py 생성
        run: |
          cat > config.py << EOF
          GEMINI_API_KEY = "${{ secrets.GEMINI_API_KEY }}"
          DISCORD_WEBHOOK = "${{ secrets.DISCORD_WEBHOOK }}"
          KEYWORDS = [
              "semiconductor stock",
              "SOXL ETF",
              "TSLA stock",
              "IONQ stock",
          ]
          SCHEDULE_TIMES = ["09:00", "19:00"]
          MAX_NEWS_PER_KEYWORD = 5
          EOF

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.vscode_push_token_2026 }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin git@github.com:bs02089-sys/strategy_engine.git

      - name: 🚀 증권 뉴스 에이전트 실행
        run: python -c "from news_agent import run_agent; run_agent()"
