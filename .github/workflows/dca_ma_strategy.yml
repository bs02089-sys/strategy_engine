name: DCA MA Strategy Engine

on:
  schedule:
    - cron: "24 23 * * 1-5"
  repository_dispatch:
    types: [ath-dca-monitor]
  workflow_dispatch:

concurrency:
  group: sigma-dca-manager
  cancel-in-progress: false

jobs:
  run-dca-manager:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Realtime ATH DCA Monitor (from cron-job.org dispatch)
        if: github.event_name == 'repository_dispatch'
        # tee: Actions 로그에도 표시 + sigma_log.txt 저장 (로그 표시 실패 방지)
        run: |
          set -o pipefail
          python DCA_MA_strategy.py --ath-monitor 2>&1 | tee sigma_log.txt

      - name: Run DCA Manager (scheduled briefing)
        if: github.event_name != 'repository_dispatch'
        run: |
          set -o pipefail
          python DCA_MA_strategy.py 2>&1 | tee sigma_log.txt

      - name: Show log on failure
        if: failure()
        run: cat sigma_log.txt

      - name: Sync and Notify
        if: always()
        run: |
          git config --global user.name "DCA Bot"
          git config --global user.email "bot@example.com"

          # 상태 파일만 커밋 (로그/히스토리는 저장하지 않음 — 커밋 노이즈 방지)
          [ -f "portfolio_config.json" ] && git add portfolio_config.json

          git commit -m "update: dca-state $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git pull --rebase || true
          git push
