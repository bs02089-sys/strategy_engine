name: DCA MA Strategy Signal

on:
  schedule:
    # 매일 23:40 UTC = 19:40 ET (장 마감 후) — 월~금
    - cron: "40 23 * * 1-5"
  workflow_dispatch:

concurrency:
  group: dca-ma-strategy
  cancel-in-progress: false

jobs:
  run-signal:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run signal and send to Discord
        # tee: Actions 로그에도 표시 + signal.log 저장
        # pipefail: python 실패가 tee 때문에 가려지지 않도록 파이프 실패 전파
        run: |
          set -o pipefail
          python DCA_MA_strategy.py --signal --discord --all 2>&1 | tee signal.log

      - name: Show logs on failure
        if: failure()
        run: cat signal.log

      - name: Commit signal log
        # 로그 뷰어 UI 표시 실패에 대비 — signal.log를 저장소에 커밋하여
        # 언제든 리포 파일로 확인 가능하게 함 (다른 워크플로우와 동일 패턴)
        if: always()
        run: |
          git config --global user.name "Signals Bot"
          git config --global user.email "bot@example.com"
          [ -f "signal.log" ] && git add signal.log
          git commit -m "update: dca-signal-log $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git pull --rebase || true
          git push
