name: DCA MA Strategy Signal

on:
  schedule:
    # 매일 23:40 UTC = 19:40 ET (장 마감 후) — 월~금
    - cron: "40 23 * * 1-5"
  workflow_dispatch:

concurrency:
  group: dca-ma-strategy
  cancel-in-progress: false

jobs:
  run-signal:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: TQQQ·SOXL 신호 → Discord (단일 메시지)
        # tee: Actions 로그에도 표시 + signal.log 저장 (로그 표시 실패 방지)
        # pipefail: python 실패가 tee 때문에 가려지지 않도록 파이프 실패 전파
        run: |
          set -o pipefail
          python DCA_MA_strategy.py --signal --discord --all 2>&1 | tee signal.log

      - name: Show logs on failure
        if: failure()
        run: cat signal.log
