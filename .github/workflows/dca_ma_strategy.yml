name: DCA MA Strategy

on:
  schedule:
    # 월~금 23:30 UTC = 19:30 ET (장 마감 후) — 브리핑 + MA 레짐 신호 통합 발송
    - cron: "30 23 * * 1-5"
  repository_dispatch:
    types: [ath-dca-monitor]  # cron-job.org 실시간 알림 발사
  workflow_dispatch:           # 수동 실행 지원

concurrency:
  group: dca-ma-strategy       # 야간 브리핑 ↔ 실시간 폴링 직렬화
  cancel-in-progress: false

jobs:
  run-dca-ma:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        # -q: pip 진행률 바(캐리지 리턴 \r)가 GitHub Actions 로그 뷰어를 깨뜨려
        #   "로그 표시 실패"/스텝 이름 오표시가 발생 — 조용히 설치해 방지
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt

      - name: Run Realtime ATH DCA Monitor (from cron-job.org dispatch)
        if: github.event_name == 'repository_dispatch'
        # tee: Actions 로그에도 표시 + sigma_log.txt 저장 (로그 표시 실패 방지)
        run: |
          set -o pipefail
          python DCA_MA_strategy.py --ath-monitor 2>&1 | tee sigma_log.txt

      - name: Run Daily Briefing (통합 메시지 — MA 레짐 신호 포함)
        if: github.event_name != 'repository_dispatch'
        # 23:30 UTC — 통합 브리핑 1건만 Discord 발송 (신호 메시지는 브리핑에 통합)
        # --signal은 콘솔 로그 확인용으로만 실행 (Discord 중복 발송 없음)
        run: |
          set -o pipefail
          python DCA_MA_strategy.py 2>&1 | tee sigma_log.txt
          python DCA_MA_strategy.py --signal --all 2>&1 | tee -a sigma_log.txt

      - name: Show log on failure
        if: failure()
        run: cat sigma_log.txt

      - name: Sync and Notify
        if: always()
        run: |
          git config --global user.name "DCA Bot"
          git config --global user.email "bot@example.com"

          # 상태 파일만 커밋 (로그/히스토리는 저장하지 않음 — 커밋 노이즈 방지)
          [ -f "portfolio_config.json" ] && git add portfolio_config.json

          git commit -m "update: dca-state $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git pull --rebase || true
          git push
