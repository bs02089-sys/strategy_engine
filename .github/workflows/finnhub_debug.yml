name: Finnhub Debug (manual)

# Manual debug workflow to test FINNHUB_API_KEY availability and API response.
# Usage: Actions -> Finnhub Debug -> Run workflow
# - Non-destructive: does not change repository.
# - Prints HTTP status and response body (masked secrets by Actions).

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: 'Ticker symbol to test (default: TQQQ)'
        required: false
        default: 'TQQQ'

jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print env presence (no secret values)
        run: |
          if [ -z "$FINNHUB_API_KEY" ]; then echo "FINNHUB_API_KEY is NOT SET"; else echo "FINNHUB_API_KEY is SET"; fi
          if [ -z "$DISCORD_WEBHOOK" ]; then echo "DISCORD_WEBHOOK is NOT SET"; else echo "DISCORD_WEBHOOK is SET"; fi

      - name: Finnhub test request
        run: |
          SYMBOL="${{ github.event.inputs.symbol }}"
          # test window: fixed historical timestamps to avoid depending on 'now'
          FROM=1622505600
          TO=1622592000
          URL="https://finnhub.io/api/v1/stock/candle?symbol=${SYMBOL}&resolution=60&from=${FROM}&to=${TO}&token=${FINNHUB_API_KEY}"

          echo "Requesting: $URL"  # token will be masked in logs
          set -o pipefail
          # capture HTTP status and body
          HTTP_STATUS=$(curl -s -w "%{http_code}" -o response.json "$URL" || echo "000")
          echo "HTTP status: $HTTP_STATUS"
          echo "Response body:" && cat response.json || true

      - name: Cleanup
        if: always()
        run: |
          rm -f response.json || true
