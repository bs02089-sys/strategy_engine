name: Temp Push Test

on:
  workflow_dispatch:

jobs:
  send-test-push:
    runs-on: ubuntu-latest
    env:
      ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Send test push to bs0208 (now)
        run: |
          set -e
          pip install -q requests
          python3 - <<'PY'
          import json, os, requests

          # APP_ID는 공개값 — swing_config.json(단일 소스)에서 읽음 (GitHub 시크릿엔 REST 키만 있음)
          cfg = json.load(open("swing_config.json"))
          app_id = (cfg.get("ONESIGNAL_APP_ID") or "").strip()
          api_key = (os.environ.get("ONESIGNAL_REST_API_KEY") or "").strip()
          if not app_id:
              raise SystemExit("ONESIGNAL_APP_ID 미설정")
          if not api_key:
              raise SystemExit("ONESIGNAL_REST_API_KEY 미설정")

          payload = {
              "app_id": app_id,
              "target_channel": "push",
              "headings": {"en": "🔔 실시간 테스트 푸시"},
              "contents": {"en": "지금 이 메시지가 폰/웹에 도착하면 OneSignal 연결이 정상입니다. (bs0208)"},
              "include_aliases": {"external_id": ["bs0208"]},
          }
          pages = cfg.get("PAGES_URL", "")
          if pages:
              payload["url"] = pages

          schemes = (("Key", "Basic") if api_key.startswith("os_v2_") else ("Basic", "Key"))
          for scheme in schemes:
              r = requests.post(
                  "https://api.onesignal.com/notifications",
                  headers={"Authorization": f"{scheme} {api_key}",
                           "Content-Type": "application/json; charset=utf-8"},
                  json=payload,
                  timeout=15,
              )
              print(f"  [{scheme} 시도] HTTP {r.status_code}: {r.text[:200]}")
              if r.status_code not in (401, 403):
                  print(f"HTTP {r.status_code}: {r.text[:400]}")
                  r.raise_for_status()
                  break
          else:
              raise SystemExit("인증 실패 (Basic/Key 모두 401/403)")
          PY
