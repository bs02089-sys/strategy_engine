name: Temp Push Test

on:
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Send test push to bs0208
        run: |
          set -e
          APP_ID=$(python3 -c "import json; print(json.load(open('swing_config.json')).get('ONESIGNAL_APP_ID',''))")
          python3 - <<EOF
          import json, os, urllib.request

          app_id = "$APP_ID"
          api_key = os.environ["API_KEY"].strip()
          payload = {
              "app_id": app_id,
              "target_channel": "push",
              "include_aliases": {"external_id": ["bs0208"]},
              "target_channel": "push",
              "headings": {"en": "📲 폰 도착 테스트"},
              "contents": {"en": "이 메시지가 폰에 도착하면 OneSignal 폰 구독이 정상 연결된 것입니다."},
          }
          data = json.dumps(payload).encode()
          req = urllib.request.Request(
              "https://api.onesignal.com/notifications",
              data=data,
              headers={
                  "Authorization": f"Key {api_key}",
                  "Content-Type": "application/json; charset=utf-8",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  print(f"HTTP {r.status}:", r.read().decode()[:300])
          except urllib.error.HTTPError as e:
              print(f"HTTP {e.code}:", e.read().decode()[:300])
              raise
          EOF
