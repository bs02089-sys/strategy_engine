name: Market Stage Tracker

on:
  schedule:
    - cron: "14 23 * * 1-5"
  workflow_dispatch:

concurrency:
  group: market-stage-tracker
  cancel-in-progress: false

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.14'}
      - run: pip install -r requirements.txt

      - name: Run Tracker
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
        # tee: Actions 로그에도 표시 + market_log.txt 저장 (로그 표시 실패 방지)
        run: |
          set -o pipefail
          python MarketStageSystem.py 2>&1 | tee market_log.txt

      - name: Commit and Push
        run: |
          git config --global user.name "Market Bot"
          git config --global user.email "bot@tracker.com"
          git add -f market_log.txt market_state.json
          git commit -m "Auto-update logs and stage state" || echo "No changes"
          git pull --rebase
          git push