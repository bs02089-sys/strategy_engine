name: sigma_position_manager

on:
  push:
    branches:
      - main
    paths:
      - sigma_position_manager.py
  schedule:
    # UTC 07:10 = KST 16:10 (미국 본장 개장 전 자동 점검)
    - cron: '10 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8

jobs:
  sigma_position_manager:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Configure Git
        # github.token 사용 시 remote URL에 토큰을 직접 삽입할 필요 없음
        # permissions: contents: write 선언으로 인증이 자동 처리됨
        run: |
          git config --global user.name "Automated Bot"
          git config --global user.email "bot@example.com"
          git remote set-url origin "https://github.com/${{ github.repository }}.git"

      - name: Sync latest data
        run: |
          git pull origin main || echo "Already up to date or no remote changes."

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum
          # [FIX] 폰트 설치 후 matplotlib 캐시를 삭제하되,
          # Python 실행 전에 삭제해야 효과가 있음 → 별도 step으로 분리
          rm -rf ~/.cache/matplotlib
          # 시스템 폰트 캐시 재빌드
          fc-cache -fv > /dev/null 2>&1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests yfinance pytz holidays matplotlib

      - name: Run sigma_position_manager
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
        run: |
          for i in {1..3}; do
            python sigma_position_manager.py && break || echo "Retry $i failed..." && sleep 10
          done

      - name: Commit and push config.json
        if: always()
        run: |
          [ -f config.json ] && git add config.json

          if ! git diff --cached --quiet; then
            git commit -m "chore: sync config.json after sigma_position_manager run ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          else
            echo "No changes to commit. Skipping push."
          fi
