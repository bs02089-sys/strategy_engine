name: sigma_position_manager

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'config.json'
  schedule:
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8
  # 여기서 API 키를 안전하게 secrets에서 가져옵니다
  ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
  DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}

jobs:
  sigma_position_manager:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "Automated Bot"
          git config --global user.email "bot@example.com"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

      - name: Sync latest data
        run: |
          git pull origin main || echo "Already up to date or no remote changes."

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # alpha_vantage 라이브러리를 추가했습니다
          pip install numpy pandas requests yfinance pytz holidays alpha_vantage

      - name: Run sigma_position_manager
        run: |
          for i in {1..3}; do
            python sigma_position_manager.py && break || echo "Retry $i failed..." && sleep 10
          done

      - name: Commit and push config.json
        if: always() && github.actor != 'Automated Bot'
        run: |
          [ -f config.json ] && git add config.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync config.json after sigma_position_manager run ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          else
            echo "No changes to commit. Skipping push."
          fi