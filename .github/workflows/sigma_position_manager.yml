name: sigma_position_manager

on:
  push:
    branches:
      - main
    paths: 
      - sigma_position_manager.py
      - config.json
        
  schedule:
    # 💡 월~금 한국 시간 저녁 7시 정각마다 자동 실행 (장전 대기 모드 브리핑)
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8

jobs:
  trade_alert:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/bs02089-sys/strategy_engine.git

      - name: Python 3.12 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 패키지 설치
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Discord 알림 실행 (sigma_position_manager)
        run: |
          for i in {1..3}; do
            # 💡 한글 파일명과 공백 처리를 위해 반드시 쌍따옴표를 씌워 실행합니다!
            python sigma_position_manager.py && break || echo "Retry $i failed..." && sleep 10
          done
