name: sigma_position_manager

on:
  push:
    branches: [main]
    paths:
      - '**.py'          # .py 파일 변경 시에만 실행
      - 'config.json'    # config.json 변경 시에도 실행    # 장부 수정 시 자동 실행
  schedule:
    # 🎯 UTC 07:00 = KST 16:00 (깃허브 서버의 지연을 감안하여 7:00로 설정)
    - cron: '0 7 * * 1-5'
  workflow_dispatch:
    # 🎯 원할 때 언제든 Actions 탭에서 버튼 눌러서 수동 실행 가능!

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8

jobs:
  sigma_position_manager:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "Automated Bot"
          git config --global user.email "bot@example.com"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

      - name: Sync latest data
        run: |
          git pull origin main || echo "Already up to date or no remote changes."

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests yfinance pytz holidays

      - name: Run sigma_position_manager
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
        run: |
          for i in {1..3}; do
            python sigma_position_manager.py && break || echo "Retry $i failed..." && sleep 10
          done

      - name: Commit and push config.json
        # push 트리거일 때 bot 커밋이 재귀 실행되지 않도록 조건 추가
        if: always() && github.actor != 'Automated Bot'
        run: |
          [ -f config.json ] && git add config.json

          if ! git diff --cached --quiet; then
            git commit -m "chore: sync config.json after sigma_position_manager run ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          else
            echo "No changes to commit. Skipping push."
          fi