name: Temp Find Phone Sub

on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest
    env:
      API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: List all users and subscriptions
        run: |
          set -e
          APP_ID=$(python3 -c "import json; print(json.load(open('swing_config.json')).get('ONESIGNAL_APP_ID',''))")
          python3 - <<EOF
          import json, os, urllib.request

          app_id = "$APP_ID"
          api_key = os.environ["API_KEY"].strip()
          req = urllib.request.Request(
              f"https://api.onesignal.com/apps/{app_id}/users?limit=50",
              headers={"Authorization": f"Key {api_key}"},
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  data = json.load(r)
                  print("HTTP", r.status)
          except Exception as e:
              print("요청 실패:", e)
              raise SystemExit(0)
          users = data.get("users", [])
          print("사용자 수:", len(users))
          for u in users:
              ident = u.get("identity", {})
              props = u.get("properties", {})
              subs = u.get("subscriptions", [])
              ext = ident.get("external_id")
              oid = ident.get("onesignal_id", "")
              print(f"--- 사용자 {oid[:8]} ext={ext!r} last_active={props.get('last_active')}")
              for s in subs:
                  print(f"    구독: {s.get('type')} enabled={s.get('enabled')} id={s.get('id','')[:8]} last_session={s.get('last_session')}")
              if not subs:
                  print("    (구독 없음)")
          EOF
