name: DCA LOC Strategy

on:
  schedule:
    # 월~금 23:30 UTC = 19:30 ET (장 마감 후) — 브리핑 + LOC 20분할 신호 발송
    - cron: "30 23 * * 1-5"
  workflow_dispatch:           # 수동 실행 지원

jobs:
  run-dca-ma:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
      # FINNHUB_API_KEY 시크릿 참조 제거 (2026-08) — Finnhub 키 로직 전면 삭제,
      # 삭제된 시크릿 참조 시 워크플로우가 실패하므로 반드시 함께 제거해야 함

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync with latest remote (start from newest state)
        # 체크아웃 직후 최신 원격 상태로 rebase — 봇이 스테일 상태를 기준으로
        # 파일을 변경하지 않도록 충돌 윈도우를 최소화한다.
        run: git pull --rebase

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        # -q: pip 진행률 바(캐리지 리턴 \r)가 GitHub Actions 로그 뷰어를 깨뜨려
        #   "로그 표시 실패"/스텝 이름 오표시가 발생 — 조용히 설치해 방지
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt

      - name: TypeScript strict typecheck (sw.js / OneSignalSDKWorker.js / dashboard inline JS)
        # JS 수정이 배포 전에 깨지지 않도록 검사 게이트 (swing_alerter.yml 과 동일, 2026-08-14)
        run: |
          npm ci --silent
          npm run typecheck

      - name: Run Daily Briefing (통합 메시지 — LOC 20분할 신호 포함)
        # 23:30 UTC — 통합 브리핑 1건만 Discord 발송 (신호 메시지는 브리핑에 통합)
        # --signal은 콘솔 로그 확인용으로만 실행 (Discord 중복 발송 없음)
        run: |
          set -o pipefail
          python LOC_DCA_strategy.py 2>&1 | tee sigma_log.txt
          python LOC_DCA_strategy.py --signal --all 2>&1 | tee -a sigma_log.txt

      - name: Show log on failure
        if: failure()
        run: cat sigma_log.txt

      - name: Sync and Notify
        if: always()
        run: |
          git config --global user.name "DCA Bot"
          git config --global user.email "bot@example.com"

          # 상태 파일만 커밋 (로그/히스토리는 저장하지 않음 — 커밋 노이즈 방지)
          [ -f "portfolio_config.json" ] && git add portfolio_config.json

          git commit -m "update: dca-state $(date +'%Y-%m-%d')" || echo "No changes to commit"
          # -X theirs: 충돌 시 원격(사람) 버전을 유지 — 봇의 스테일 상태는 버리고 다음 실행에서 재생성.
          # || true: 일시적 실패(네트워크 등) 시에도 push는 계속 시도해 갱신 유실을 방지
          # (충돌은 -X theirs가 자동 해결하므로 || true는 일시적 오류만 삼킨다)
          git pull --rebase -X theirs || true
          git push
