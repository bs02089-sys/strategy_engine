name: LOC DCA Strategy

on:
  schedule:
    # 월~금 23:30 UTC = 19:30 ET (장 마감 후) — 브리핑 + LOC 5분할 신호 발송
    - cron: "30 23 * * 1-5"
  workflow_dispatch:           # 수동 실행 지원

jobs:
  run-loc-dca:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
      # FINNHUB_API_KEY 시크릿 참조 제거 (2026-08) — Finnhub 키 로직 전면 삭제,
      # 삭제된 시크릿 참조 시 워크플로우가 실패하므로 반드시 함께 제거해야 함

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync with latest remote (start from newest state)
        # 체크아웃 직후 최신 원격 상태로 rebase — 봇이 스테일 상태를 기준으로
        # 파일을 변경하지 않도록 충돌 윈도우를 최소화한다.
        # ⚠️ 이 스텝이 죽으면 브리핑·푸시가 통째로 skipped 된다 — 2026-09-23 러너 TLS 실패
        # (server certificate verification failed. CAfile: none)로 알림 런이 즉사했다.
        # ① 기본 pull → ② 시스템 CA 번들 명시 재시도 → ③ 그래도 실패하면 경고만 남기고 진행
        run: |
          if git pull --rebase; then exit 0; fi
          sleep 3
          CA=/etc/ssl/certs/ca-certificates.crt
          if [ -f "$CA" ] && git -c http.sslCAInfo="$CA" pull --rebase; then exit 0; fi
          echo "::warning::원격 동기화 실패 — 체크아웃(최신 커밋) 상태로 계속 진행합니다"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        # -q: pip 진행률 바(캐리지 리턴 \r)가 GitHub Actions 로그 뷰어를 깨뜨려
        #   "로그 표시 실패"/스텝 이름 오표시가 발생 — 조용히 설치해 방지
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt

      - name: TypeScript strict typecheck (sw.js / OneSignalSDKWorker.js / dashboard inline JS)
        # JS 수정이 배포 전에 깨지지 않도록 검사 게이트 (swing_alerter.yml 과 동일, 2026-08-14)
        run: |
          npm ci --silent
          npm run typecheck

      - name: Run Daily Briefing (통합 메시지 — LOC 5분할 신호 포함)
        # 23:30 UTC — 통합 브리핑 1건만 Discord 발송 (신호 메시지는 브리핑에 통합)
        # --signal은 콘솔 로그 확인용으로만 실행 (Discord 중복 발송 없음)
        run: |
          set -o pipefail
          python LOC_DCA_strategy.py 2>&1 | tee sigma_log.txt
          python LOC_DCA_strategy.py --signal --all 2>&1 | tee -a sigma_log.txt

      - name: Show log on failure
        if: failure()
        run: cat sigma_log.txt

      - name: Sync and Notify
        if: always()
        run: |
          git config --global user.name "DCA Bot"
          git config --global user.email "bot@example.com"

          # 상태 파일만 커밋 (로그/히스토리는 저장하지 않음 — 커밋 노이즈 방지)
          [ -f "portfolio_config.json" ] && git add portfolio_config.json

          git commit -m "update: dca-state $(date +'%Y-%m-%d')" || echo "No changes to commit"
          # -X theirs: 충돌 시 원격(사람) 버전을 유지 — 봇의 스테일 상태는 버리고 다음 실행에서 재생성.
          # pull 은 실패해도 계속 시도(|| true)하고, 상태 push 는 일시 네트워크/TLS 실패를
          # 3회까지 재시도해 흡수한다 — 최종 실패는 스텝 실패로 노출(2026-09-23 러너 TLS 실패 대응).
          # push 실패 시 인증서 검증 실패(CAfile: none) 대비 시스템 CA 번들 명시 재시도 포함.
          CA=/etc/ssl/certs/ca-certificates.crt
          ok=false
          for i in 1 2 3; do
            git pull --rebase -X theirs || true
            if git push; then ok=true; break; fi
            if [ -f "$CA" ] && git -c http.sslCAInfo="$CA" push; then ok=true; break; fi
            echo "::warning::dca-state push 실패 (시도 $i/3) — 3초 후 재시도"
            sleep 3
          done
          $ok || { echo "::error::dca-state push 3회 실패 — 이번 회차 상태가 저장되지 않았습니다"; exit 1; }
