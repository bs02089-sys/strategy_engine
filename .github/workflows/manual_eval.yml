name: Manual Swing Eval

# Manual evaluation workflow — preserves your habit of running evaluation manually
# Usage: GitHub UI -> Actions -> Manual Swing Eval -> Run workflow -> choose mode (dry/save)
# - dry : run evaluation and print results (no file changes)
# - save: run evaluation with --save --since all and open a PR with updated swing_performance.json
# This workflow is intentionally dispatch-only (no schedule) to avoid changing your manual workflow.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode: dry (no save) or save (create PR with swing_performance.json)'
        required: true
        default: 'dry'
      since:
        description: 'Since parameter for evaluation (e.g. all, 3m, 1y)'
        required: true
        default: 'all'

jobs:
  eval:
    name: Run swing_bot_eval
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies (if any)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run evaluation (dry or save)
        id: run_eval
        run: |
          echo "Running swing_bot_eval.py (mode=${{ github.event.inputs.mode }}, since=${{ github.event.inputs.since }})"
          if [ "${{ github.event.inputs.mode }}" = "save" ]; then
            python swing_bot_eval.py --save --since "${{ github.event.inputs.since }}"
          else
            python swing_bot_eval.py --since "${{ github.event.inputs.since }}"
          fi

      - name: Show git status (debug)
        if: ${{ github.event.inputs.mode == 'save' }}
        run: |
          git status --porcelain
          git --no-pager diff --name-only || true

      - name: Create PR with updated swing_performance.json (if any changes)
        if: ${{ github.event.inputs.mode == 'save' }}
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update swing_performance.json — eval snapshot\n\nGenerated by manual_eval workflow"
          branch: "auto/eval-snapshot-${{ github.run_id }}"
          title: "chore: swing eval snapshot — run #${{ github.run_number }}"
          body: |
            Automated performance snapshot generated by manual workflow.

            - mode: ${{ github.event.inputs.mode }}
            - since: ${{ github.event.inputs.since }}

            Please review the updated swing_performance.json and merge when satisfied.
          labels: |
            automated
            eval-snapshot

# Notes:
# - This workflow is dispatch-only to match your habit of manual runs.
# - It creates a PR instead of pushing directly to main to avoid unexpected repository changes.
# - If you prefer automatic scheduled runs in future, we can add a schedule trigger but it is omitted intentionally.
