name: Temp Check Subs

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check users by onesignal_id
        run: |
          set -e
          APP_ID=$(python3 -c "import json; print(json.load(open('swing_config.json')).get('ONESIGNAL_APP_ID',''))")
          python3 - <<EOF
          import json, os, urllib.request

          app_id = "$APP_ID"
          api_key = os.environ["API_KEY"].strip()
          ids = ["c33eb986-57d3-4266-b378-a959439d508f", "ec0b1f60-b559-4bb1-adcd-08e7d0d74ea0"]
          for oid in ids:
              url = f"https://api.onesignal.com/apps/{app_id}/users/by/onesignal_id/{oid}"
              req = urllib.request.Request(url, headers={"Authorization": f"Key {api_key}"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      d = json.load(r)
                      print(f"=== {oid[:8]} → HTTP {r.status} ===")
                      ident = d.get("identity", {})
                      props = d.get("properties", {})
                      print("  external_id:", ident.get("external_id"))
                      print("  last_active:", props.get("last_active"))
                      subs = d.get("subscriptions", [])
                      print("  구독 수:", len(subs))
                      for s in subs:
                          print(f"    - {s.get('type')} enabled={s.get('enabled')} id={s.get('id','')[:8]} last_session={s.get('last_session')}")
              except urllib.error.HTTPError as e:
                  print(f"=== {oid[:8]} → HTTP {e.code} (삭제됨 또는 없음) ===")
              except Exception as e:
                  print(f"=== {oid[:8]} → 오류: {e} ===")
          EOF
