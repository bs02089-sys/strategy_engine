name: Swing TP Quarterly Review

on:
  schedule:
    # 3개월 주기: 1/4/7/10월 1일 09:00 UTC — TP 승수 재평가 보고서를 Discord로 전송
    # (표본 부족 시 "유지 권장"만 보고 — 승수는 자동 변경되지 않음)
    - cron: "0 9 1 1,4,7,10 *"
  workflow_dispatch:           # 수동 실행 지원 (언제든 재평가 가능)

concurrency:
  group: swing-tp-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # ADJUST 시 swing_config.json 자동 반영 커밋용
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync with latest remote (start from newest state)
        run: git pull --rebase

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r requirements.txt

      - name: Run quarterly TP review
        # 재평가 + 조건부 자동 적용(AUTO_UPDATE=true 시 ADJUST 확정 승수를
        # swing_config.json에 반영). Discord 보고서에 변경 근거가 포함된다.
        run: |
          set -o pipefail
          python swing_tp_review.py --discord 2>&1 | tee tp_review_log.txt

      - name: Show output on failure
        if: failure()
        run: cat tp_review_log.txt

      - name: Commit auto-applied TP multipliers
        # ADJUST로 승수가 변경된 경우에만 swing_config.json이 바뀌어 커밋된다
        # (변경 없으면 "No changes to commit"으로 스킵 — 커밋 노이즈 없음)
        run: |
          git config --global user.name "TP Review Bot"
          git config --global user.email "bot@example.com"
          [ -f "swing_config.json" ] && git add swing_config.json
          git commit -m "update: swing-config (TP review) $(date +'%Y-%m-%d')" || echo "No changes to commit"
          # -X theirs: 충돌 시 원격 버전 우선 — 다음 실행에서 재반영
          git pull --rebase -X theirs || true
          git push
