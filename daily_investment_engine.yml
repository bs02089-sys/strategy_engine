name: 매일 투자 엔진 (신호 및 매매 관리)

on:
  schedule:
    - cron: "0 23 * * 1-5" # KST 08:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-investment-engine:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
      PYTHONIOENCODING: utf-8
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests numpy pytz holidays

      # 1단계: 신호 생성기 실행
      - name: Run bear market signals
        run: python bear_market_signals.py

      # 2단계: 매매 매니저 실행
      - name: Run sigma_DCA_manager
        run: |
          for i in {1..3}; do
            python sigma_DCA_manager.py && break || echo "Retry $i failed..." && sleep 10
          done

      # 3단계: 결과 Git 반영
      - name: Commit and push changes
        run: |
          git config --global user.name "Automated Bot"
          git config --global user.email "bot@example.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "chore: update investment data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      # 4단계: Discord 알림
      - name: Send Discord notification
        if: always()
        run: |
          python - << 'PYEOF'
          import os, json, requests
          webhook_url = os.environ["DISCORD_WEBHOOK"]
          user_id = os.environ["DISCORD_USER_ID"]
          
          payload = {"content": f"<@{user_id}> 🤖 매일 투자 엔진 가동 완료. 신호 및 매매 가격 연산이 종료되었습니다."}
          requests.post(webhook_url, json=payload, timeout=15)
          PYEOF